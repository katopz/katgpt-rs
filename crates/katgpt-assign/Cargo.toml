[package]
name = "katgpt-assign"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Spec-driven constrained assignment solver — objects into containers under capacity/balance/movement specs, delta-evaluated over an integer expression DAG with deterministic local search. Pure modelless combinatorics, no application semantics."
readme = "README.md"
repository = "https://github.com/katopz/katgpt-rs"
keywords = ["assignment", "constraint-solver", "local-search", "bin-packing", "combinatorial"]
categories = ["algorithms", "science"]
# Publish-ready zero-dep leaf (the katgpt-dec pattern); the crates.io push
# rides the next katgpt-core release and is an owner act.

[dependencies]
# Zero dependencies — katgpt-assign is a pure-combinatorics substrate that
# sits UPSTREAM of katgpt-core (which takes it as an optional path dep behind
# the `assignment` feature and re-exports it as `katgpt_core::assign`; the
# katgpt-dec -> katgpt_core::dec precedent). Integer determinism (G1) is a
# crate-level requirement: no floats anywhere in the objective path, so it
# cannot be retrofitted — the API never carries float accumulation.

[features]
# Opt-in measurement axis (Issue 741 class): makes the alloc-tracking test
# module compile in --release so the G4 zero-alloc gate can run against
# optimised code. Off in every shipped build.
alloc_tracking = []
# Issue 1211 descent lane: K-chain orchestration + abstain-on-budget + the
# fitted-level outcome gate (`descent.rs`). Opt-in; feature-off builds are
# byte-identical to the incumbent (the module compiles to nothing; no
# solver/types surface changes ride the feature).
descent = []

[[bench]]
name = "bench_924_assignment_g2_baselines"
harness = false

[[test]]
name = "issue1211_descent"
required-features = ["descent"]

[[test]]
name = "issue1211_t2_baselines"
required-features = ["descent"]
