[package]
name = "katgpt-canon"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Canonical Intent Space — architecture-neutral intent directions + per-model adapters (Proposal 009, Research 459). Composes orthogonal_procrustes (katgpt-spectral) with thin_svd_into (katgpt-core) into a CanonicalIntent × ModelAdapter → model-specific-latent functor. P0 ships CanonicalIntent + ProcrustesAdapter (same-arch); P1 ships SubspaceAdapter (cross-arch joint-SVD — Bench 423 G5 PASS at k∈{2,4}). The intra-arch path is unaffected by the P3c cross-arch exhaustion verdict. G1/G2/G4 GOAT stamp measured per Bench 562 (2026-07-28)."
repository = "https://github.com/katopz/katgpt-rs"
keywords = ["canonical", "intent", "procrustes", "subspace", "modelless"]
categories = ["algorithms", "science"]
publish = false  # depends on katgpt-spectral (private) — not part of the katgpt-core publish family

[dependencies]
# katgpt-core: thin_svd_into + SvdResultScratch + SvdScratch for the joint
# SVD step in SubspaceAdapter. The `subspace_phase_gate` feature is DEFAULT-ON
# in katgpt-core (Plan 301 Phase 5) so the substrate is always compiled; we
# still spell it out so a future katgpt-core default-off flip can't silently
# break the canon crate.
katgpt-core = { path = "../katgpt-core", features = [] }
# katgpt-spectral: orthogonal_procrustes (Issue 001 / Plan 152) for the
# ProcrustesAdapter + the k-dim alignment step inside SubspaceAdapter.
# Always-on — both adapters depend on it. Forwards the `orthogonal_procrustes`
# feature so the `procrustes` module is compiled (it's feature-gated in
# katgpt-spectral itself).
katgpt-spectral = { path = "../katgpt-spectral", features = ["orthogonal_procrustes"] }
# blake3: BLAKE3 tag/commitment for CanonicalIntent + adapters (freeze/thaw
# attestation + cross-node verify). Non-optional — every public surface
# carries a [u8; 32] commitment.
blake3 = "1"
# bytemuck: zero-cost f32→bytes cast for blake3 commitments. Non-optional —
# every adapter's commitment() casts an f32 slice to bytes.
bytemuck = "1"
# syn: Rust-source parsing for the AST node-type histogram extractor (Issue
# 867 T1 — the non-hidden-state canonical construction, Proposal 010 §
# Feature 1). Optional, feature-gated (`canon_source_features`), SETUP-TIME
# only — never on a per-token path. BOUNDARY.md §May depend on carries the
# matching row.
syn = { version = "2", optional = true, features = ["full", "visit"] }

[dev-dependencies]
# Issue 867 T1 corpus gate: reads the sibling whole-item pairs.jsonl.
serde_json = "1"

[features]
default = []

# P0 — CanonicalIntent + ModelAdapter trait + ProcrustesAdapter (same-arch).
# Opt-in. Promotion to default-on gated on G1–G4 GOAT (Proposal 009 §GOAT).
# The intra-arch claim (same-dim model pairs) is unaffected by the P3c
# cross-arch exhaustion verdict.
canon = []

# P1 — SubspaceAdapter (cross-arch joint-SVD). Implies `canon`. The
# load-bearing result is Bench 423 (G5 GO at k∈{2,4} on Gemma2-2B ↔
# MiniCPM5-1B held-out). Opt-in — the cross-arch canonical DIRECTION claim
# is demoted per P3c, but the cross-arch shared SUBSPACE result (pairwise
# alignment preservation at low k) is real and ships here.
canon_subspace = ["canon"]

# P4 — MaskAdapter (lottery-ticket mask application). Implies `canon`.
# Mask discovery is training-side (riir-train); mask APPLICATION is
# modelless elementwise multiply. Opt-in until P4 lands.
canon_mask = ["canon"]

# Issue 867 Phase 1 — AST node-type histogram extractor over `syn::visit`
# (`source_features` module). Standalone: does NOT imply `canon` — source
# features are architecture-independent inputs, orthogonal to the adapter
# features; the T2 SourceFeatureAdapter composes them explicitly. Opt-in
# (Proposal 010 self-assesses HIGHLY SPECULATIVE); setup-time only.
canon_source_features = ["dep:syn"]

# Forwards katgpt-core's alloc_tracking (Issue 741 convention, same shape as
# katgpt-forward's row): compiles katgpt-core's `alloc` module in RELEASE so
# the G4 alloc-check test binary (source_adapter_alloc_check) can be read in
# the optimized profile too. Without it the alloc module exists only under
# debug_assertions and the release reading is compile-to-nothing.
alloc_tracking = ["katgpt-core/alloc_tracking"]

# ─── Bench 562 — GOAT G1/G2/G4 gates (ProcrustesAdapter + SubspaceAdapter
# + MaskAdapter). std::time::Instant + inlined CountingAllocator (matches
# the procrustes_bench convention; criterion is not a dep). Runs all three
# adapter sections when all three features are enabled; runs only ProcrustesAdapter
# when just `canon` is on.
[[bench]]
name = "canon_goat"
path = "benches/canon_goat.rs"
required-features = ["canon_subspace", "canon_mask"]
harness = false

# ─── P1 smoke test — SubspaceAdapter on a planted shared subspace. Imports
# CanonicalIntent / ModelAdapter / SubspaceAdapter / fit_joint_svd_pair /
# JointSvdFitScratch, all of which live behind `canon_subspace` (the first two
# behind `canon`, which it implies). Declared explicitly so the default
# no-feature `--all-targets` build skips it instead of failing to resolve the
# imports.
[[test]]
name = "subspace_planted_signal"
required-features = ["canon_subspace"]

# ─── Issue 867 T1 corpus gate — extractor correctness on inline idiom
# pairs (iterator-chain vs index-loop, `?` vs unwrap) + determinism + the
# sibling whole-item corpus read when the riir-train checkout is present
# (loud skip otherwise — katgpt-rs is the public upstream and must stay
# green in a bare clone).
[[test]]
name = "source_features_corpus"
required-features = ["canon_source_features"]

# ─── Issue 867 T2 G4 — SourceFeatureAdapter zero-alloc apply gate. Separate
# binary so the counting allocator is binary-unique (bench_811 convention).
# The file's own #![cfg] additionally carries the alloc tracker's profile
# gate (any(debug_assertions, alloc_tracking)): a release build without that
# feature compiles this target to an empty binary BY DESIGN — required-features
# (not the cfg alone) is what keeps plain `cargo test` from reporting a green
# zero; run it at DEV profile:
#   cargo test -p katgpt-canon --features canon_source_features --test source_adapter_alloc_check
[[test]]
name = "source_adapter_alloc_check"
required-features = ["canon_source_features"]
