velocity_field_ensemble = []  # Velocity-Field Ensemble — algebraic combination of P frozen pre-trained velocity fields into a regression-optimal combined drift b̂(x) = Σ η_i b_i(x), η solved once from N data pairs via linalg::ridge_solve (Plan 376, Research 375, arXiv:2602.20070 Coeurdoux et al. ICML 2026 SPIGM). Same P×P Cholesky math as KARC; the contribution is the basis construction (P model outputs as features, not delay-embedded observations). Includes the optimal-diffusion SDE integrator (paper Algorithm 1, D*_t = α_t γ_t / β_t) as a decoupled utility. DEFAULT-ON (Plan 376 Phase 3, 2026-07-04): G1 9/9 unit tests (η recovery <1e-4), G2 3/3 cross-domain metrics (3.5× MSE reduction vs single-best in related-sources regime; honest PoC with unrelated-sources null), G3 0 allocs + all-features/no-default clean, G4 fit_into 6.27µs<50µs + eval_into 21ns<200ns + eval_batch(1000) 20µs<5ms. Pure modelless (closed-form ridge solve, no training, no softmax).
