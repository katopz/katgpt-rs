smooth_min_similarity = []  # Smooth-Min Soft Similarity — modelless latent-space utility for fuzzy multi-token retrieval (Research 385, SoftMatcha 2, arXiv:2602.10908 Yoneda et al. ICML 2026). smooth_min_similarity aggregates per-position cosines via 1−log_β(Σ(β^(1−c_i)−1)+1), interpolating plain-min (β→∞) ↔ plain-sum (β≈1). edit_penalty computes exp(−v/γ) for insertions/deletions. GOAT PoC PASS (Issue 041, 2026-07-12, removed, see git history): G1 +12.0pp recall@5 over plain cosine (0.815 vs 0.695 on 200-item synthetic retrieval with all-4-token mismatches), G2 ~0ns overhead (LLVM vectorized), G3 all β∈[10¹,10⁶] beat plain cosine. Consumer GOAT PASS (Issue 041 T6, 2026-07-12): RerankMethod::SmoothMinAligned recall@5 = 1.000 vs Cosine 0.495 (+50.5pp) on position-aligned multi-token retrieval. Pure modelless (arithmetic on pre-computed cosines, zero deps). DEFAULT-ON (2026-07-12): first consumer GOAT gate passes with modelless gain.
recos = ["smooth_min_similarity"]  # Rearrangement-Inequality Cosine Similarity (Plan 437, Research 421, arXiv:2602.05266 Ai 2026 "Beyond Cosine Similarity"). Saturates at 1.0 under ordinal concordance (monotonic relationship) — a strictly wider capture range than cosine (which needs linear dependence); always |recos| >= |cos| in abs value (Corollary 2). recos_sim / recos_sim_ranking operate on fixed [f32;8] (HLA dim, stack-sort, alloc-free); recos_sim_slice operates on arbitrary-len slices (MAG d=64 style_weights, heap sort, cold-path OK). O(d log d) — one sort per vector; structurally CANNOT reuse cosine's pre-computed-norm fold (bound is a function of sorted order, not norm). Implies smooth_min_similarity so the similarity module compiles under --no-default-features. STAYS OPT-IN — Plan 437 Phase 2 GOAT G1 FAIL (Bench 437, 2026-07-14): recos does NOT beat cosine on our embedding regime (recall@1 -16.5pp, recall@5 -1.2pp); gate settled on DEMOTE. NOT UQ-bearing (no probability/interval/coverage claim) — the "Report the Floor" rule does not apply.
simd_lut_dequant = []  # SIMD LUT Dequantization — software analog of StreamDQ near-memory DQ (Plan 431, Research 418, arXiv:2607.08993 Jeong et al. SK Hynix 2026). Generic format-parameterized dequantize primitive: pre-compute a stack [f32;N] LUT per quant group (INT4=16 entries=1 cache line, INT8=256 entries=1KB), then replace the per-element integer-arithmetic INT→FP cast with a single LUT lookup. The paper's shared-FP32-ALU + LUT-type-cast pattern lifted to software SIMD. Realistic target 1.0-1.5x microbench (the paper's 7x is hardware-only). Pure modelless (LUT build + indexed reads). **DEFAULT-ON (2026-07-18 cargo-comment sync):** direct in katgpt-core `default` (line 103); the "Opt-in until GOAT gate (Phase 4 G1 bit-exact + G2 latency ≥1.2x on NEON) settles promote/demote" caveat is stale.
elasticity_gated_update = []  # Elasticity-Gated Update — DSOM error-scaled neighborhood update primitive (Plan 429, Research 415, Rougier & Boniface "Dynamic Self-Organising Map" Neurocomputing 2011 ⟨inria-00495827⟩ + survey arXiv:2501.08416). Time-invariant, error-scaled latent update: step = ε·error, weight = exp(−d²/(η²·error²)), delta = step·Σ(w·(neighbor−state))/Σ(w). Properties: (1) error-scaled step (plasticity when far, stability when close), (2) error-gated neighborhood expansion (wide when error is large, tight when small), (3) structure-matching (maps support not density — rare regions get equal representation, PoC-verified G5 PASS). Pure modelless (closed-form exp + weighted average). Zero-alloc (stack [f32;32] weights, &mut [f32] output). Opt-in in katgpt-core (consumer enables transitively). Consumer GOAT PASS (riir-neuron-db, 2026-07-12): G1 error-scaled step ratio ~50, G2 latency 1.015–1.035× fixed-alpha + 194–253 ns compute surcharge < 500 ns, G3 eta=None bit-identical, G4 determinism 100/100, G5 structure-matching coverage 23.31, G6 freeze gate compat. Consumer feature `elasticity_gated_heal` PROMOTED to default-on (behavior opt-in via `.with_neighbor_eta(1.0)`). Primary consumer: riir-neuron-db neighbor_heal (error-scaled shard heal). Secondary: evolve_hla, graph_laplacian. Phase 5 T5.1 (2026-07-12): `error_weighted_graph_laplacian_into` — DSOM × DEC fusion composing `neighborhood_weight` with `katgpt_dec::graph_laplacian`; gated on `dec_operators` + `elasticity_gated_update`; 6 tests PASS.

mag_mining = []  # MAG — Mining via Activation Geometry (Plan 418, Research 397, arXiv:2607.04222 LeVi/David/Fomin ICML 2026 FAGEN). Unsupervised direction mining + modelless transfer prediction. mine_direction / mine_contrast_direction extract unit-norm feature directions from prefix-induced activation shifts using the model's own verdict y_M as the label (no human labels, no gradient descent). reconstruction_error computes the linearity diagnostic ϵ_Q. calibrate_alpha makes injection strength substrate-invariant. apply_operator computes the 8 MAG readout summaries. transfer_score / rank_candidates predict which candidate dataset/experience best improves a target capability modellessly (the paper's §4 94.7% Top-1 result). The missing acquisition step for the direction-vector ecosystem: Latent Field Steering (P309) injects, EmotionDirections (P162) supervised-extracts, MAG mines unsupervised. blake3 is already non-optional (no dep: prefix needed). Pure modelless (mean-difference + cosine geometry + BLAKE3 commit). DEFAULT-ON (2026-07-09, Phase 2 GOAT G1-G6 ALL PASS): G1 mine_direction cos=1.000/mine_contrast cos=0.985, G2 LOO acc 0.925@σ=1.5 + 0.810@σ=3.0 (headline kill-it gate PASS), G3 ϵ_Q 0.0/1.0/4.0, G4 MAG Top-1 0.720 vs raw cosine 0.220 (3.3×), G5 zero-alloc (_into variants), G6 mine_direction 10.13µs/transfer_score 0.52µs/recon_error 4.41µs (10-30× headroom). Phase 2 added mine_direction_into + transfer_score_into zero-alloc hot-path variants. See .benchmarks/418_mag_goat.md.

multi_agent_path = []  # Lifelong LaCAM Multi-Agent Pathfinding Substrate — modelless receding-horizon windowed multi-agent pathfinder (Plan 440, Research 424, arXiv:2605.16855 Arita & Okumura AAAI 2026). Pure heuristic: PIBT one-step generator + space-time A* guidance on collision-count cost + warm-start schemes (LLLG_Π / LLLG_Φ / LLLG_∅) + hindrance estimator. Four pluggable seams (CostFn, LocalGuidanceSource, WarmStartScheme, HindranceEstimator) for the Super-GOAT fusion (riir-ai/318: HLA × Crowd MCGS × P350). Scales to 10K agents at <1s/step (paper-reported). Entirely heuristic — no training, no backprop. Opt-in — Plan 440 Phase 2 GOAT gate RAN (.benchmarks/440_lllg_paper_repro_goat.md, .plans/440_lifelong_lacam_multi_agent_pathfinding_substrate.md status '✅ COMPLETE, OPT-IN'): G3/G4 PASS, G1 2/4 real maps PASS (empty + random pass, warehouse 0.41 + ht_chantry 0.27 FAIL on real MovingAI maps per Issue 148), G2 FAIL (warm-start non-consumable). Stays opt-in per Plan 440 Phase 5 verdict (Issue 143 LaCAM escalation landed separately as Plan 453). The Super-GOAT promotion requires the riir-ai fusion gates G5–G7.
lacam_escalation = ["multi_agent_path"]  # Bounded one-step LaCAM escalation (Plan 453, Research 441) — replaces the fake 'LaCAM escalation' (shuffled-priority retries) with real LaCAM: the constraint-tree search from Okumura 2023, applied to a single tick. The critical insight from reading the reference implementation (Kei18/lacam/src/planner.cpp): LaCAM DOES use recursive PIBT (the PI piece Issues 140/143 tried and reverted), but it works because the constraint tree bounds the recursion and provides systematic backtracking. Issues 140/143 collapsed throughput because they used recursive PI WITHOUT the constraint tree. This feature ships the constraint tree — the missing half. Scope: one-step (find a collision-free joint action for the current tick), bounded by a node/time budget, with greedy-PIBT fallback. Opt-in — Plan 453 all 5 phases DONE (.benchmarks/453_lacam_escalation_goat.md — G-col collision-freedom + G1 throughput + G-PI no-collapse all PASS); stays opt-in per Plan 453 T5.3 decision.

poincare_navigator = []  # Poincaré Adapter — closed-form latent navigation primitive (Plan 449, Research 449, arXiv:2607.14228 Chen et al. *SeeSE3* DeepMind 15 Jul 2026). Frozen PoincareAdapter Pod (φ + W + W† triple, BLAKE3-committed) + navigator poincare_navigate_into: realizes `z_dest = z_src + φ⁻¹(φ(z_src) + W†·Δtarget)` as one MLP eval + one matvec + one back-projection. Multi-step variant `poincare_multi_step_into` splits Δtarget into N open-loop sub-steps. Offline fit via closed-form PCA-tanh φ + ridge W + SVD pseudoinverse W† (NO gradient descent — modelless per research skill §3.5). The 4/4 Super-GOAT novelty gate (Q1 no prior art, Q2 new capability class, Q3 product selling point, Q4 force multiplier ≥10 systems). Closes the two-brain model's imagination gap (private guide riir-ai/.research/319). Private game-runtime selling point (NPC imagination via single matvec, BLAKE3-verifiable) stays in riir-ai. Pure modelless (closed-form PCA + ridge + SVD); reuses Plan 301's thin_svd_into + Plan 308's ridge_solve_direct_f32. Sibling of Latent Field Steering (P309 forward) and Viable Manifold Graph (P312 graph); they cover the three navigation regimes (forward / graph / closed-form). Gated on subspace_phase_gate (Plan 301 thin SVD). DEFAULT-ON (Plan 449 Phase 3, 2026-07-18): G1-G7 GOAT gate ALL PASS. G2 (global unrolling) originally passed the spec threshold (adapter R²=0.71 > 0.5) but did NOT strictly dominate linear-only ridge (R²=0.93); G2 strict-domination was subsequently CLOSED by Plan 317 (riir-train/crates/riir-train-engine/src/poincare_phi_train.rs, `fit_poincare_adapter_trained`: 2-layer MLP φ via AdamW, ~15ms fit-time, frozen at inference). Cross-verification bench bench_317_poincare_g2_strict reproduces the exact G2 fixture and reports trained R²=0.9997 vs linear-only 0.9255 (gap +0.0741, all three thresholds PASS). The primitive's load-bearing value is the closed-form inverse navigation (G3 = perfect Hit@0.3 = 1.000) + the frozen Pod commitment pattern. Promotion follows the codebase pattern (manifold_bandit P370, set_attention P354, ac_prefix P313): modelless + zero-cost-unless-invoked + GOAT-passes → default-on. See .benchmarks/449_poincare_goat.md.

causal_identification = []  # Causal-ID — Algorithmic Syntactic Causal Identification (Plan 457, Research 450, arXiv:2403.09580 Cakiqi & Little 2024). Pure modelless graph rewriting on ADMGs with bidirected confounders: identify(Y, do(A)) returns the interventional signature backbone Y⋆ = An(Y in G[V\A]) via the recursive Shpitser-Pearl ID algorithm (Cakiqi-Little Theorem 1 distillation). The Issue 545 defend-wrong PoC proved S2 strictly dominates Canvas FlowGraph reachability on a 13-node game KG with a NPC1↔NPC2 confounder: S2 produces a 5-node interventional signature that correctly excludes NPC1 (the confounder neighbor); S1 yields only a boolean reaches=true and cannot see the confounder. Four submodules: types (NodeId BLAKE3 [u8;32], Admg, AdmgSignature inline-ArrayVec<32>→heap fallback, IdentificationError with hedge pair for diagnostics), fixing (districts, ancestors, fix_node, try_fixseq greedy fixing sequence — sound per Cakiqi-Little §3.2: order doesn't affect existence), identify (the 6-step recursive ID), subgraph (extract_relevant_subgraph bounded-BFS — caveat #2 mitigation to keep the O(k²)–O(k³) algorithm on a ≤32-node subgraph). DEFAULT-ON (Plan 457 Phase 5 promotion, 2026-07-18): Phase 2 GOAT gate G1+G2+G3+G4 ALL PASS (G4 closed 2026-07-18 by Issue 183 / Benchmark 465: Scratch refactor cut per-call allocs 284→198 (-30%) + latency 8.26→6.07 µs (-27%) on 32-node scenario; remaining graph-construction allocs out of G4 scope); Phase 4 T4.5 synthetic Consumer A bench (.benchmarks/464_causal_id_consumer_a_synthetic.md) cleared the T4.7 promotion gate: 71.7% non-trivial Ok rate + 43 actionable interventional signatures Canvas FlowGraph reachability cannot derive. Promotion follows the codebase pattern (manifold_bandit P370, set_attention P354, poincare_navigator P449): modelless + zero-cost-unless-invoked + GOAT-passes → default-on. Consumer B T4.6 (sleep-cycle trace) remains BLOCKED on real-trace capture + new counterfactual-claim infrastructure (T4.3); per Plan 457 §T4.7 the promotion criterion is Consumer A OR Consumer B, so Consumer A passing alone is sufficient. Algorithm provenance: the PoC caught a soundness bug in the one-pass formulation (districts of G[Y⋆] vs G[V]); this ships the corrected recursive version. Pure modelless — no training, no learned params. Offline-only (24µs on 13 nodes is well outside the 20Hz tick). blake3 + arrayvec already non-optional.

# numeric_stability (Issue 697 Phase 1 / Research 515, arXiv:2405.02803 "Is
# Flash Attention Stable?"): the numeric-deviation contextualization probe —
# an f64 mantissa-truncation format emulator (T1.1), the two-surface
# DeviationReport (elementwise max_diff + 1-D Wasserstein delegated to
# mag::transfer's quantile-grid core, T1.2), the reference-band acceptance
# rule accept(reports, refs, margin) with an EXPLICIT caller margin — NO
# default is derived from the paper's context-specific 2-5x headline
# (T1.3), the R1 two-draw + R2 quantize->dequant round-trip reference
# builders (R2 labeled a SINGLE-STEP LOWER BOUND and pinned by a doc-truth
# tripwire test, T1.4), and the scope-limit tripwire (divergence similarity,
# NOT training stability — arXiv:2510.04212 owns the mechanism, T1.5). T3.1
# planted-deviation gate (0.1x/1x/10x of the reference band lands
# Accept/margin-line/Reject) is the falsifiability proof. Zero-alloc hot
# paths (*_into grow-only scratch, the Plan 418 pattern); no new deps;
# deterministic (no HashMap iteration; NaN rejected at the boundary).
# Opt-in — first consumer: riir-ai gate layer; riir-train side: Issue 492.
# Phase 2 (perturbable reference attention lab) lands in this module later.
numeric_stability = ["mag_mining"]

