clr_weighted_set_attention = ["set_attention"]  # CLR-Amplified Set Attention (Plan 570, Research 469, Issue 575). Reliability-weighted sibling of set_sigmoid_attention_into: accepts per-entity reliability weights r_j and modulates attention as output_i = h_i + (γ/Σ r_j)·Σ_j α_ij·r_j·(v_j−h_i). When r_j=1 for all j, reduces bit-identically to plain SA (G1 special case). The reliability weighting converts plain averaging (which dilutes signal — the G8 failure) into amplification by concentrating the aggregate toward high-reliability entities. CLR reliability scores computed via clr_reliability_scores(states, directions, M, ...) produce r_j = (mean_m sigmoid(h_j·dir_m))^M — the CLR nonlinear reliability gate (Plan 284, Research 255). Issue 575 PoC proved CLR's ^M exponent closes the G8 collective-inference failure on a synthetic N=64 crowd threat-detection task: CLR 17.6% top-1 vs plain SA 9.4% vs individual 12.0% (+5.6pp identification gain, 6.23× aggregate amplification). DEFAULT-ON (Plan 570 Phase 3, 2026-08-06): G1 uniform≡plain bit-identical (dense+topk), G2 latency ratio 1.00× (≤2× target), G4 0 allocs/100 calls, G8a CLR reliability identification 17.6% vs plain SA 8.9% (Δ+8.7pp ≥5pp target), G8b CLR-weighted SA aggregate amplification 3.88× (≥2× target).
phase_separation = []  # Phase Separation Probe — per-entity minimum circular distance on a phase circle, distilled from the Lonely Runner Conjecture (Plan 571, Research 470, arXiv:0710.4495 Barajas & Serra 2007). Three modelless paths over &[f32]: phase_separation (O(N) single entity), phase_separation_all (O(N²) all pairs), phase_separation_sorted (O(N log N) sort + adjacent-neighbor scan, production). Plus two bridge helpers: from_speeds_and_tick (raw time-phase, sync-safe) + from_latent_projection (latent σ(d·z) bridge, local-only). The LRC guarantees (proven N≤7, conjectured beyond) every entity cycles through phase_separation ≥ 1/N — a coverage guarantee no existing primitive provides. Pure modelless (closed-form modular arithmetic + sigmoid + dot-product). DEFAULT-ON (2026-08-07, Plan 571 Phase 1 GOAT bench): G1 8 lib tests (determinism + LRC N≤7 bound); G2 phase_separation_sorted 7947ns @ N=1000 (<10us) + O(N log N) 12.49x scaling (<20x); G3 1845->1853 (+8, 0 regressions); G4 0 allocs/1000 calls. See bench_571_phase_separation_goat.
signed_coupling_dynamics = []  # Signed-Coupling Opinion Dynamics — Glauber (heat-bath) update on a SIGNED social graph + the three crowd order parameters, distilled from "Physics of Agents" (El et al., arXiv:2608.16578, Aug 2026; Research 497, Issue 680). h_i = beta_plus*sum(J+ s) + beta_minus*sum(J- s) + beta_zero*sum(|J| s) + g_i, P(s_i=+1) = sigmoid(h_i) — three couplings (ally pull / rival push / mere-connection pull) collapsed into ONE branch-free O(edges) pass over a CSR row via a 2-entry sign-indexed weight LUT. Ships: SignedGraph (row-compressed signed adjacency, u32 indices, no heap after construction; symmetric = the paper form + directed = asymmetric social influence), Couplings (paper-fitted range midpoints as defaults) with at_social_temperature (the one-scalar designer dial: high T = apathy, low T = mob), InformedCouplings + signed_coupling_update_informed_into (the paper 5-coupling truth asymmetry: correct neighbors pull harder on the concordant channel, wrong ones push harder on the discordant — a SIBLING fn, not a flag, so no branch enters the inner loop), sample_states_into (caller-supplied uniforms → RNG-free + replayable), and the three order-parameter reducers: net_opinion (mean s), crowd_conviction (mean s^2 — NEW, nothing in the stack shipped a mean-square crowd reducer), SusceptibilityAccumulator (Welford Var_t(|n|) in f64 → chi = N*Var; T_c = argmax over a temperature sweep, offline bench only, not a tick path). Pure modelless: the paper GD-fits ~19 scalars to real LLM transitions, but a game crowd AUTHORS its couplings, so the fitted ranges become designer-facing constants (PAPER_BETA_*_RANGE). Zero runtime cost unless invoked. VOCABULARY COLLISION (load-bearing for greps): crowd_conviction here = crowd ORDER PARAMETER mean(s^2); Sheaf-ADMM conviction (katgpt-dec::sheaf_admm, riir-agents::multi_agent) = per-agent RESISTANCE in the consensus quadratic. Different quantities, and they compose (a sheaf conviction vector is a natural g_i source). OPT-IN — promotion waits on a production consumer (the clr_weighted_set_attention precedent: default-on only after the swarm consumer adopted it). GOAT G1-G4 record at .benchmarks/672_signed_coupling_goat.md.
rrq_quant = []  # Recurrent Residual Quantization (Plan 568, Research 467, arXiv:2608.04048 Luo et al. Intel Aug 2026) — single-checkpoint multi-precision weight representation via iterated 2-bit RTN residual corrections. W̃(t) = Ŵ0 + Σ_{k=1..t} R̂k — base stage + N residual stages, each 2-bit RTN with per-group scale + zero-point (f16 metadata, group_size=128 default). Default 1 base + 3 residuals → 2/4/6/8-bit prefixes from one checkpoint. prefix_dot_into exploits matmul linearity: x·W̃(t) = Σ per-stage GEMVs. Pure modelless PTQ (RTN, no Hessian, no calibration data, no training). Phase 2 adds the load-time quant-strategy router: peak_to_mean_ratio (paper §3 PMR) + select_quant_strategy (QuantStrategy::Rrq/DirectRtn/FlagForReview) composing PMR with the Research 200 KS D-statistic (passed in as a scalar; computed by katgpt_spectral::ks_d_statistic, Plan 224 OAQG substrate — katgpt-core is the leaf and must not depend on katgpt-spectral). Phase 3 adds the fused multi-stage LUT dequant+dot kernel (dequant_dot_via_lut_multi_stage in simd_lut_dequant; RrqWeights::prefix_dot_lut_into, gated by BOTH rrq_quant + simd_lut_dequant) — **G2 HONEST NEGATIVE**: 4-stage 2-bit LUT path is ~6× SLOWER than single-8-bit at parity (4× gather overhead dominates the L1-residency benefit at realistic LLM-tile scale). The kernel is correct substrate (G1 PASS); prefix_dot_into (arithmetic path) remains the recommended hot path. Closest cousin: quant_error_lora (single SVD correction vs N iterated RTN corrections). Verdict: Gain (not Super-GOAT — no concrete consumer today); opt-in until a multi-precision LLM serving / per-NPC expert base sharing / incremental precision upgrade consumer lands.
selection_propagation = []  # Selection-Set Fixpoint Propagation — query-seeded importance propagation iterated until the top-r selected set stabilizes (Issue 655 / Research 483, KEEP arXiv:2602.23592 M3; HippoRAG PPR class). The one genuinely-unshipped composition from the Research 483 substrate audit: every arrow already shipped (query seeding, top-r selection, one-step edge propagation, CLR sigmoid reliability), but no loop iterated a SELECTION SET to a membership fixpoint. propagate_selection_to_fixpoint_into: scores = (1-α)·seed + α·Σ w_ji·sigmoid(β·score_j) over the selected set's out-edges, early-stop when the membership bitset repeats (mirrors recall_to_fixed_point(tol, max_sweeps); oscillation falls to max_iters). Two blend modes: Mass (PPR-style, default — preserves edge weight) + Mean (the literal KEEP edge_avg — documented degeneracy: w cancels for single-supporter nodes, kept + measured so the degeneracy is falsified not assumed). Zero-alloc caller-owned scratch, deterministic CSR summation order, sigmoid membership gate (never softmax). POC harness: tests/bench_655_selection_propagation_poc.rs (G1 head-to-head vs single-hop + BFS-decay at equal budget) + bench_655_propagation_latency (G2) + bench_655_propagation_alloc_check (G4). Opt-in — promotion depends on the Issue 655 G1 verdict + downstream consumers (riir-rag fuse_graph_candidates F1, engram chain recall F2).
