[package]
name = "katgpt-core"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "Shared types and SIMD kernels for katgpt-rs and riir-engine"
repository = "https://github.com/katopz/katgpt-rs"
readme = "README.md"
keywords = ["inference", "simd", "modelless", "attention", "manifold"]
categories = ["algorithms", "science", "data-structures"]

[dependencies]
fastrand = "2"
rayon = "1.10"
log = "0.4"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
half = "2"
bytemuck = { version = "1", features = ["derive"] }
# Stack-allocated Vec for MCTSNode children/unexpanded (Plan 008 Phase 2.6):
# eliminates per-node heap allocation. Capacity bounded by MAX_UNEXPANDED=16
# (covers Bomber=6, Grid=5, Raid=~9 branching factors with headroom).
arrayvec = "0.7"
papaya = { version = "0.2", optional = true }
rustfft = { version = "6", optional = true }
lz4_flex = { version = "0.13", optional = true }
# ahash is used by `closure_instrument` (Plan 290 G1 hot-path optimization).
# Already a transitive dep via hashbrown 0.14 / bevy_utils — listing it here only
# promotes it to a direct dependency for the `closure_instrument` feature.
#
# `default-features = false` + a per-target RNG source (see the two [target.*]
# sections at the bottom of this file): ahash's default `runtime-rng` pulls
# `getrandom`, which has no working backend on wasm32-unknown-unknown and
# fails the build outright. Native keeps `runtime-rng` (OS entropy, full
# HashDoS resistance); wasm32 gets `compile-time-rng` (seed baked in per
# build). Declaring the feature per-target rather than swapping it globally
# means native behavior is unchanged. Note `default-features = false` must
# appear on EVERY declaration — Cargo unions features across all applicable
# sections, so a single defaulted declaration would re-enable `runtime-rng`
# on wasm32 and undo this.
ahash = { version = "0.8", optional = true, default-features = false, features = ["std"] }
# katgpt-dec houses the Discrete Exterior Calculus substrate spun out of
# katgpt-core::dec (Issue 007 Phase E Tier 1). Optional — pulled in by the
# `dec_operators` feature and re-exported as `katgpt_core::dec` for backwards
# compatibility.
katgpt-dec = { path = "../katgpt-dec", version = "0.1.3", optional = true }
# katgpt-types houses the shared types + SIMD substrate spun out of
# katgpt-core::{types, simd} (Issue 007 Phase E Tier 1 #2). Always-on — the
# types/simd modules are foundational substrate that every other katgpt-core
# module consumes. Re-exported as `katgpt_core::types` and `katgpt_core::simd`
# for backwards compatibility.
katgpt-types = { path = "../katgpt-types", version = "0.2.1" }
# katgpt-micro-belief houses the micro-recurrent belief-state kernel spun out
# of katgpt-core::micro_belief (Issue 007 Phase E Tier 1 #3). Optional — pulled
# in by the `micro_belief` feature and re-exported as `katgpt_core::micro_belief`
# for backwards compatibility.
katgpt-micro-belief = { path = "../katgpt-micro-belief", version = "0.2.1", optional = true }
# katgpt-hla houses the Higher-order Linear Attention substrate (cache types +
# streaming kernels) AND the composition layer (forward_hla / forward_ahla,
# Issue 007 Phase F.4b) spun out of katgpt-core::hla. Always-on — re-exported
# as `katgpt_core::hla` for backwards compatibility. The composition layer
# moved from root `src/hla/forward.rs` into katgpt-hla now that ForwardContext
# lives in katgpt-forward.
katgpt-hla = { path = "../katgpt-hla", version = "0.1.3" }
# katgpt-personality houses the Personality-Weighted Latent Layer Composition
# substrate (sigmoid + kernel + snapshot + types) spun out of
# katgpt-core::personality_composition (Issue 007 Phase E Tier 2 #5). Optional
# — pulled in by the `personality_composition` feature and re-exported as
# `katgpt_core::personality_composition` for backwards compatibility.
katgpt-personality = { path = "../katgpt-personality", version = "0.1.3", optional = true }
# katgpt-sleep houses the Sleep-Time Query Anticipator substrate (anticipator
# + consume + cost_model + predictability + types) spun out of
# katgpt-core::sleep_time (Issue 007 Phase E Tier 2 #6). Optional — pulled in
# by the `sleep_time_anticipation` feature and re-exported as
# `katgpt_core::sleep_time` for backwards compatibility.
katgpt-sleep = { path = "../katgpt-sleep", version = "0.1.3", optional = true }
# katgpt-sense houses the KG Latent Octree Sense substrate (octree,
# reconstruction, bake, lod, schema_centroid, sector, serialize) spun out of
# katgpt-core::sense (Issue 007 Phase E Tier 2 #7, Plan 338). Optional —
# pulled in by the `sense_composition` feature and re-exported as
# `katgpt_core::sense::*` for backwards compatibility. `spectral_threat`
# stays local in katgpt-core (depends on `linoss`) and is re-exported through
# the `sense::spectral_threat` shim path.
katgpt-sense = { path = "../katgpt-sense", version = "0.2.1", optional = true }
# Plan 299 T4.3: tokenizer compression (NFKC + lowercase collapse) for the
# `engram` feature. Small dep, only compiled when `engram` is on.
unicode-normalization = { version = "0.1", optional = true }

# ahash RNG source, per target — see the `ahash` comment in [dependencies].
# Native: OS entropy (ahash's own default). wasm32: build-time constant seed,
# because `getrandom` has no wasm32-unknown-unknown backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ahash = { version = "0.8", optional = true, default-features = false, features = ["runtime-rng"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ahash = { version = "0.8", optional = true, default-features = false, features = ["compile-time-rng"] }

[dev-dependencies]
serde_json = "1"
# Phase 10 (2026-07-04): trigger_gate's from_toml/to_toml are test-only.
toml = "0.8"
# Plan 388 Phase 1: freeze module's save/load roundtrip tests.
tempfile = "3"
# Used by the Plan 323 Fourier-continuation GOAT bench (G1 FFT-based Gibbs
# suppression test). Already a normal optional dep; listed here so the bench
# target can use it without enabling an unrelated feature.
rustfft = "6"
# criterion pulls rayon, which has no wasm32 backend. Benches run on native
# only; gate accordingly so wasm32 example builds (Issue 007 GOAT harness)
# don't unify it in.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# proptest pulls rusty-fork → wait-timeout, which has no wasm32 backend.
# Property tests (Plan 299 T1.7) run on native only; gate accordingly so
# wasm32 example/bench builds (Issue 007 GOAT harness) don't unify it in.
proptest = "1"  # Plan 299 T1.7 — multi_head_hash property tests (determinism + uniform distribution)
# statrs test-only reference for best_belief G1 GOAT gate (Plan 336 T2.1).
# Native-only — pulls deps that don't wasm-build.
statrs = "0.17"

[features]

# kinematic_rollout (Plan 578 / Research 506, 2026-08-25): the modelless
# core of LDR (arXiv:2608.09926) — finite-difference kinematic state (order
# ladder 0→3), O(1) Newton-backward closed-form rollout EXACT on degree ≤ 3
# motion (ID-OOD gap ≡ 0 on the analytic family — the provable
# strengthening of the paper's empirical ~20×), deterministic jerk/drag
# schedules, looming time-to-contact, regime predicates, residual-surprise
# events with restitution, two-body intercept math, + the UQ-bearing
# extrapolation-horizon admission bound (RANK-ONLY verdict vs the
# conformal-naive floor — see the Report-the-Floor row in .benchmarks/680).
# Pure f32 arithmetic, zero deps, zero allocs, #[repr(C)] POD.
# DEFAULT-ON since 2026-08-26 (Bench 680 GOAT G1–G4 ALL PASS — the KARC
# precedent: pure math, no dep surface, zero-cost-unless-invoked; the
# consumer PoC is riir-ai Issue 757, gated on this landing).
kinematic_rollout = []

# Stale-residual speculative layer pipelining analysis (Issue 691 /
# Research 508, arXiv:2608.23841 §6.3): residual-dominance ratios + paper
# viability bar, accept/rollback threshold gate, KL/top-1 speculative
# outcome metrics + θ-sweep reduction, and the (C+IO)/max(C,IO) overlap
# latency model parameterized by bits/weight. Pure modelless analysis over
# captured activations. OPT-IN pending the Issue 691 POC verdict.
stale_residual = []

# Conditioning-consistency audit (Issue 719 / Research 528, arXiv:2609.00865
# "MemoryWalker"): per-junction forward-KL between a compressed-conditioned
# (student) forward and a full-context (teacher) forward over the same decode
# positions + the unconditional Pinsker total-variation verdict
# `TV <= sqrt(eps_KL / 2)` + the greedy-stream flip counter + the
# calibrated-zero (compression-off) control arm. Modelless pure-f32
# arithmetic over logits; the per-junction KL DELEGATES to
# `stale_residual::kl_logits` (substrate composition, no duplicate numeric
# core). Opt-in — NO live consumer (every shipped numeric-compression surface
# is gated stronger at bit-identity); T2 Gemma-4 ring / T3 packer / T4 H2O
# stay trigger-gated. No default promotion, no GOAT claim until a consumer
# exists.
cond_audit = ["stale_residual"]

# cadence_gate (Issue 720 T1 / Research 529, HRM mechanistic dissection,
# Rodrigues & Kang ICML 2026 Mech Interp Workshop — Finding 4, n=93/107):
# ConvergenceCadence — windowed update-magnitude outcome classifier for any
# iterative latent loop. Solved runs' ‖Δz‖ DECAYS (0.30 by step 7-8); failed
# runs PLATEAU HIGH (1.46, ~4.9×) — the windowed shape (two half-window means
# + absolute floors) classifies settled vs churning long before the final
# step. The OUTCOME read the halt-only GainCostLoopHalter (gain_cost_halt
# feature) lacks: halt ≠ classify; plateau-high churn warrants ESCALATION
# (damp per Issue 717 — tangential-first, cos_updates ≈ 0 — deliberate per
# NPC think loops, restart per CGSP), never just halt. Three laws recorded at
# the probe site: absolute Δ (never relative — R35/717-T6 trap), windowed
# shape (never single-step), tangential-first. Zero-alloc fixed ring, O(1)
# push/classify, caller-fed norms (step_size / evolve_belief already hold the
# delta). Pure f32, zero deps. Opt-in — T2 (riir-poc defend-wrong A/B,
# `b18b7b2bb`) + T3 (mmorpg Issue 054 L2 consumer, riir-ai `681786288` +
# mmorpg `8c99624`) LANDED; promotion per the no-default-consumer rule.
cadence_gate = []

# support_regime (Issue 693 / Research 513, arXiv:2608.22764 — LpWM: A Case
# for Sparse Representations in World Models, Kuang et al. 2026-08-24): the
# consecutive-tick TEMPORAL consumer of the iou kernel — support instability
# `1 − iou(z_t, z_{t+1})` (Ruzicka similarity complement) as a free
# state-side regime-transition detector + mode-factored state accessors
# (SupportMask hard-Jaccard discrete half / magnitudes continuous half).
# Debounced detector: window-mean + hysteresis, tick-indexed (the
# decay_confidence pattern — no wall-clock). Implies
# functional_substitution_gate because the module lives INSIDE that
# feature-gated parent (an empty dep list would gate a module whose parent
# compiles to nothing — a dead feature). Pure f32 arithmetic over the shipped
# SIMD iou, zero deps, zero allocs. OPT-IN: T3 PoC verdict + GOAT recorded in
# .benchmarks/685; promotion blocked on a riir-ai consumer (R352) per the
# no-default-consumer rule (the evpi_gate precedent).
support_regime = ["functional_substitution_gate"]

# rating (Issue 686, 2026-08-25): Elo + Plackett-Luce rating primitives —
# standard expected-score/K-update (win/loss + draw-scored), the λ→Elo
# conversion curve (base + scale·log10 λ, the fixed point pairwise Elo and
# batch PL share), + f32 twins. Promoted from FOUR in-stack copies
# (katgpt-pruners arena EloCalculator, katgpt-pruners proof lambda_to_elo,
# riir-ai riir-games ruliology ParadigmRanking, riir-clippy src/elo.rs) —
# all four delegate here; every delegation bit-identical to the copy it
# replaced (Bench 675). Pure modelless arithmetic, no deps, no allocs,
# zero-cost-unless-invoked.
rating = []

# prover_selection (Issue 692 T1–T3, 2026-08-27, from Research 509 —
# arXiv:2410.08146): prover-selection statistics kernels. T1 ships the
# D/Al complementarity selector — distinguishability + alignment +
# Theorem 3.1's γ·(D+Al) predicted-gain bound + its sigmoid-gated
# exposure (the strength-ranking inversion: pick provers by
# complementarity, not mean acceptance). T2 ships the first_pit
# changepoint kernel (first index where Q̂ < ε) — consumed by riir-clippy's
# PAV data curation (riir-train Plan 356 A1) via a same-signature twin
# that swaps to this import on the next dep bump. T3 ships the K* law —
# k_star (the closed-form interior-optimum rollout count) + bok_advantage
# (the BoK gap A(K)), gate-pinned against the empirical argmax on an
# exhaustive (Q,V) grid. Pure modelless arithmetic, no deps, no allocs,
# zero-cost-unless-invoked.
# DEFAULT-ON since 2026-08-27 (Bench 684 GOAT G1–G5 PASS — T5 head-to-head:
# D+Al-ranked selection beats strength-ranked, 16 seeds; module ungated in
# lib.rs per the `rating` precedent). This feature remains as an inert
# alias for existing consumers.
prover_selection = []

# laprop (Issue 689, 2026-08-25): LaProp normalize-before-accumulate
# momentum — EMA over RMS-normalized intake with the closed-form
# accumulator bound |m| ≤ 1/√(1−ν) (L∞; L2 form √D/√(1−ν)). Deletes
# downstream clamps at heavy-tailed-intake sites (riir-clippy ema_step is
# the documented consumer; migration is its own A/B in that repo). Vector
# + scalar twins, zero deps, zero allocs. OPT-IN until a consumer adopts
# (T3 promote/demote decision: G1–G4 pass but no default consumer yet).
laprop = []

# sterling_primitives (Issue 672 / Research 491, 2026-08-19): Steerling-8B
# (arXiv:2608.07594) inference-time distillate — relu_gated_suppression_into
# (one-sided logit mask; naive subtraction promotes anti-aligned tokens),
# decomposed_readout[_gemv_into] (Σ parts + residual == fused BIT-IDENTICAL via
# fixed summation order — attribution as a byproduct of the computation it
# explains), LiftTableBuilder/lift_set_to_bias_table (two-pass corpus
# statistic expression targets), tau_over_peak_calibration (γ = τ/peak), + the
# HSIC-style cross-covariance gauge (measure-only). The noisy-OR rider is
# UNGATED at the crate root (civ salience gate delegates under DEFAULT
# features). Opt-in: promotion requires a consumer GOAT (riir-ai Issue 732 —
# exact-emotion-ledger NPC decisions — is the first candidate).
sterling_primitives = []

# recirculation (Issue 673 Phase 1 / Research 492, 2026-08-19): RecircOp —
# cross-step convex norm-matched residual mixture (arXiv:2608.17981 Mozer et
# al., DeepMind), sibling of RelocateOp (R417). Paper: 4.7–16% ppl reduction
# training-free on Gemma3. Opt-in: promotion requires the Phase 2 defend-wrong
# PoC on gemma-2-2b (ppl reduction > 0 on ≥2 datasets AND strictly safer than
# the R417 overwrite at equal layer pairs) — the 2×-KV/serial-prefill cost
# accounting rides the same PoC.
recirculation = []

# contrastive_scope (Issue 674 / Research 493, 2026-08-19): LittleLearner
# scope-gated epistemics (arXiv:2608.13545) — ContrastiveScoreTable (two-corpus
# log-odds, BLAKE3-committed, freeze/thaw-able), scope_score D(x) (Naive-Bayes
# log-LLR sparse GEMV), epistemic haircut ĉ = c·sigmoid(−κ·D) + decline wiring,
# + the paired OOS probe battery (Report-the-Floor extension). "A relevance
# check is not a scope check."
#
# DEFAULT-ON since 2026-08-20 (Bench 669 T5 rule satisfied): the riir-clippy
# consumer adoption LANDED (riir-clippy Bench 040 / Plan 016 — the input-scope
# gate at the heal() seam: ScopeModel over the domain corpus vs a canonical
# non-Rust out-corpus; OOS inputs declined 8/8 vs served 8/8 un-gated;
# in-distribution healing bit-identical over the full corpus; 529 ns/input;
# steady-state alloc delta −1). κ/θ re-pinned by the consumer from its measured
# gap (θ=0, κ=4.5). No papaya dep — the built table is immutable (lock-free
# reads by construction); papaya is reserved for a live-update consumer
# integration. Pure modelless (counts + log2 + sigmoid + BLAKE3); zero runtime
# cost unless a table is constructed.
contrastive_scope = []

# bounded_target (Issue 695 / Research 432, arXiv:2608.24646 DiffusionOPSD):
# the modelless half of the OPSD recipe — SPSA bounded-target direction
# (unit by construction), bounded pairs/corrections (type-level ‖Δ‖≤ε),
# the ε-ladder, the scorer-vitality canary, and the realization-gap triage
# (fixpoint + budget law + ρ̂ model). Gates BOTH bounded_target and
# realization_gap modules (the issue's "same feature or rider" clause).
# Zero-alloc by construction (fixed [f32; 64] cap); pure f32 math + one
# BLAKE3 XOF per direction. Opt-in — consumers (riir-train Plan 360,
# riir-clippy score-bench axis, riir-ai self-adaptive loops) adopt
# consumer-side; DEFAULT_C is a prior, calibrate per use-site.
bounded_target = []

# anti_common_mode (Issue 696 T1 / Research 433, arXiv:2608.23664 RVM
# §C.3): the DT2 dynamic-tracking reward shape as a scalar gate —
# peak-quantile statistic (mean of the fastest 5%, select_nth_unstable_by
# partition, total_cmp), context-scaled threshold (τ = 6·context; paper:
# 6·min(H,W)/256), median subtraction over the hack-carrying population
# (cancels the population-dominant common mode exactly), and the band
# window (both extremes → 0, only the genuine middle band earns signal).
# Zero-alloc: &mut [f32] in-place reorder contract (multiset preserved).
# Opt-in POC — promotion ONLY via the T3 consumer PoC (CLR crowd-panic
# re-enable); named consumer: tick_swarm_emotions_collective.
anti_common_mode = []

# anchored_reach (Issue 696 T2 / Research 433, arXiv:2608.23664 RVM Eq. 7):
# the anchored signed-reach blend `out = anchor + A·(cand − anchor)` —
# scalar or per-axis A, zero-alloc *_into forms, BIT-IDENTICAL pole fast
# paths at A ∈ {0, 1} (clamp / plain adoption — the composed form loses
# bits: 1e-30 + (1e-40 − 1e-30) = 0.0), and the A(r) schedule
# constructors (linear r / house-sigmoid 2σ(kr)−1 via fast_sigmoid /
# sign-flip (2r−1)/β̄). Five regimes: clamp / blend / adopt /
# overshoot / repel. Sigmoid-not-softmax by construction (pointwise — RVM
# never normalizes across the group). Opt-in POC — promotion via the T4
# consumer A/Bs; INDEPENDENT of anti_common_mode.
anchored_reach = []

# ignition_schedule (Issue 459 T5, 2026-08-19): closed-form logistic
# ignition curves z(t) = K·σ(ζt−c), the patience law t* = ln(1/ε)/ζ, and a
# ζ-descending ordering helper — the modelless half of NQF staged learning
# (arXiv:2608.13335 via riir-train Research 422 §3.5). GOAT G1–G4 PASS
# (Bench 666). Opt-in: promotion to default requires the consumer pilot win
# (selection patience scaled by ignition_time vs fixed patience).
ignition_schedule = []

# limit_fixture (Issue 580, 2026-08-10): the LIMIT adversarial retrieval fixture
# from arXiv:2508.21038 §5.2 — a combinatorially dense qrel matrix for stressing
# single-vector retrieval capacity, plus recall@k and a reference modelless
# 8-D embedder. Opt-in: a cold-path eval fixture, never linked into production.
# Consumed by riir-neuron-db to measure ShardIndex / ItemEmbedIndex / Bm25Index.
limit_fixture = []

# switch_cost (Issue 663, 2026-08-17): SwitchCostTable — directed pairwise
# switch-difficulty table, the modelless skill-entropy distillation
# (Research 484 / arXiv:2608.05139). Opt-in per the issue's GOAT-gate
# discipline: promotion to default requires a riir-ai consumer A/B (F1:
# SkE-gated preemptive re-estimation vs the coherence-only arm).
switch_cost = []

# freedom_selection (Issue 665, 2026-08-17): extension-count (freedom-of-
# function) selection criterion — log_freedom / freedom_gain / LossGate /
# ExtensionOccupancy (src/extension_count.rs) + the renoise-CE freedom
# sibling best_of_n_freedom. Modelless closed-form selection over a declared
# finite output partition (Bennett, arXiv:2608.05423; Research 486). Opt-in
# PoC-gated: promotion to default requires the Issue 665 PoC gate (freedom-
# guided near-best beats min-loss AND random-near-best under a declared
# distribution shift) plus a production consumer.
freedom_selection = ["renoise_ce"]

# effective_degree (Issue 668, 2026-08-17): Effective Degree — a modelless
# FUNCTION-space simplicity metric (src/effective_degree.rs). Fits a degree-K
# Chebyshev expansion to a frozen function restricted to data-anchored
# interpolation paths and reports `ED = Σ|c_k|·k` (Research 488 / Zhang et al.,
# arXiv:2605.29823, ICML 2026). Reuses `karc::ChebyshevBasis` for the basis and
# `linalg::{cholesky_f64, chol_solve_f64}` for the damped normal equations —
# hence the `karc_forecaster` implication (already default-on, so this adds no
# build cost to a default build). The paper's DIFFERENTIABLE ED regularizer is
# training-only and explicitly NOT distilled here (Research 488 §7 → riir-train).
# Opt-in, consumer-gated: promotion to default requires the riir-neuron-db
# Issue 602 freeze-gate PoC to show ED predicts held-out shard-decode error
# better than the incumbent parameter-space `can_freeze::output_flatness`.
# Until then this is a diagnostic surface with no default consumer.
