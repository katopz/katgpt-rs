transfer_matrix_band_structure = []  # Transfer-Matrix Band-Structure Analyzer (Plan 458, Research 451) — Kronig-Penney delta-lattice distillation: given a sequence of k×k TransportOperators or a periodic stack, compute the composite's eigenvalues, per-mode Bloch factor μ = λ^(1/N), and classify each mode as Propagating (|μ|≈1, allowed band), Decaying (|μ|<1−ε, evanescent), or Growing (|μ|>1+ε, unstable). The ML anchor is Bai/Koltun/Kolter DEQ Jacobian Regularization (arXiv:2106.14342 ICML 2021): their ρ(J_*)<1 stability condition is the scalar spectral-radius version of this primitive's per-mode band classifier. Sits on top of analytic_lattice::compose_chain (uses the existing matmul chain) + a self-contained f32 symmetric Jacobi eigensolver. Zero-alloc hot paths (band_classify_into, analyze_chain_into, analyze_periodic_into). STAYS OPT-IN per Plan 458 Phase 4 T4.2 promotion decision (Bench 458, 2026-07-18): G1–G4 ALL PASS, G5 (cross-arch bit-identity) deferred to CI. Symmetric-matrix-only Jacobi eigensolver is a documented v1 limitation — non-symmetric TransportOperator chains (the general case) need a QR-based eigensolver (deferred to a follow-up plan if a concrete consumer needs it).
sleep_time_anticipation = ["dep:katgpt-sleep"]  # Sleep-Time Query Anticipator — open primitive for offline query anticipation (Plan 334, Research 318, arXiv:2504.13171 Lin et al. Letta/Berkeley). Substrate lives in the katgpt-sleep crate (Issue 007 Phase E Tier 2 #6); this feature turns on the re-export. SleepTimeAnticipator orchestrates per-direction sleep-time compute → emits reusable AnticipatedQuerySet (c' artifact, BLAKE3-committed) → wake-time consume() does cheap dot-product + sigmoid-gated lookup, falling through to fresh compute on low-predictability queries. PredictabilityScorer trait + DotPredictabilityScorer default (p = sigmoid(α·dot(c,dir)+β)); AmortizationCostModel operationalizes the paper's §5.3 cost model (sleep_cost + N·t·b_max·(1−E[gate])). Phase 1 ships traits + types + IdentityFunctorOp (synthetic-test default, z_i = c + dir_i). Game-specific direction-vector catalogs, NPC tiering, HLA wiring, chain commitment live in riir-ai Plan 341 (private). Opt-in — Plan 334 Phase 1+2 synthetic gates G1/G2/G5/G6/G7 ALL PASS (.benchmarks/334_sleep_time_goat.md, 2026-06-27); riir-ai Plan 341 Phase 7 GOAT G1-G4 PASS on real corpus — promoted to DEFAULT-ON in riir-engine npc_sleep_time (T7.3 + Issue 005). This katgpt-core leaf stays opt-in as layer split (production runtime is riir-engine-side). Sigmoid, not softmax (per AGENTS.md).
