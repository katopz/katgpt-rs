linking_fold_fold = []  # Linking-Fold hot-path correction ONLY (Plan 410, Research 391, arXiv:2606.31856 Ren & Lim ICML 2026). Coordinate-wise |x−c| fold (paper Eq. 1: |x|=x+2·ReLU(−x)) as the deterministic modelless unlinking correction — `fold_projection_into` / `fold_gelu_into`. Closes a gap the codebase has implicitly: every sigmoid projection (HLA scalars, direction-vector projections, ItemEmbedIndex cosine retrieval) is monotonic → provably cannot linearly separate linked manifolds (paper Thm 4.7). DEFAULT-ON (Plan 410 T4.4 Option C, 2026-07-07): the fold passes every GOAT gate modellessly — G1 ✅ (fold unlinks Hopf link), G2 ✅ (12.5ns@D=8 Abs / 16.1ns@D=8 Gelu / 16.8ns@D=64 Abs / 16.9ns@D=64 Gelu, all under 50ns/500ns budgets), G3 ✅, G4 ✅ (0 allocs/1000 calls × 4), G5 ✅ (bit-identical). Hot-path, zero-alloc, #[inline], pure stdlib. Zero runtime cost unless invoked.
linking_fold_detector = []  # Linking-Number Detector cold-path ONLY (Plan 410, Research 391, arXiv:2606.31856 Ren & Lim ICML 2026). Algorithm 1 (PCA-3D + ε-kNN + fundamental cycle basis via BFS spanning forest + Gauss linking integral) detects whether two point clouds are topologically linked (link≠0). OPT-IN (Issue 050 unresolved): the detector FAILS its original G2 budget (50ms@n=2×1000 — the brute-force O(β²) implementation measures 407ms@n=2×200 and extrapolates to minutes@n=2×1000). It PASSES a recalibrated 500ms@n=2×200 audit-cadence budget. Audit-cadence (per sleep-cycle, not per-tick); may allocate. Promote `linking_fold_fold` (the correction) is default-on; this detector sub-feature stays opt-in until Issue 050 resolves (accept budget / optimize / keep split).
ssmax_temperature = []  # SSMax — length-aware log-N attention temperature (Plan 411, Research 392, arxiv 2607.01538 Gollapudi et al. *Drowning in Documents at Million Token Scale*). Multiplicative pre-attention logit rescaling `s̃ = s_L · log(N) · s` that cancels the (N−1) denominator growth in the attention dilution bound `α_gold ≈ 1 / (1 + (N−1) · N^{−s·Δ})`. Default `s_L = 1.0` is truly modelless (zero training, zero new params); an optional rolling-Δ estimator gives a runtime-adaptive `s_L ≈ 1/Δ_typical`. Composes with sigmoid parallax (`parallax_attn`) and standard SDPA (`attention`); does NOT apply to `funcattn` (Research 261 closed negative: basis-mode has no (n,n) matrix → no dilution). DEFAULT-ON (Plan 411 Phase 5, 2026-07-07): G1+G2+G3+G4+G5 ALL PASS. Zero runtime cost unless invoked (ParallaxConfig.ssmax defaults None; apply_ssmax_to_row is a no-op when None; ssmax_none_is_bit_identical_to_base test verifies zero default-behavior change).
ssmax_adaptive = ["ssmax_temperature"]  # SSMax built-in rolling-Δ estimator (Plan 411 S2). `RollingDeltaEstimator` — lock-free EMA (`AtomicU64` CAS loop) of the `max(logits) − mean(logits)` proxy for the gold-distractor gap Δ. Produces `SsmaxMode::Adaptive` on demand via `to_mode()`. Warm-start Δ=1.0 → s_L=1.0 (matches Fixed default). Opt-in — S2 GOAT gate G1-G5 ALL PASS (2026-07-07, .benchmarks/411_ssmax_adaptive_goat.md — G1 rel err 1.0-2.6%, G2 estimator beats analytical cos 0.975 vs 0.972, G3 6.55µs/call <100µs, G4 0 allocs, G5 warm-start bit-identical); stays opt-in pending riir-ai runtime PoC on real (non-synthetic) attention distributions. Zero runtime cost unless a caller constructs `RollingDeltaEstimator`.
gold_share_probe = []  # GoldShare — content-specific output-fraction diagnostic `‖a^G_L‖ / ‖a_L‖` (Plan 411, Research 392, arxiv 2607.01538 Gollapudi et al.). Decomposes a layer's attention output into gold-derived vs distractor-derived fractions; detects when output has been rewritten from gold-content to aggregate-noise at comparable magnitude (paper Table 1: `‖a_L‖` shrinks ~36% while gold-share collapses 130× across N ∈ {500→10k}). Complements `effective_rank` (content-agnostic aggregate) and `stable_rank_update` (per-sink degeneracy). Standalone norm computation — leaf, no deps (data_probe/mod.rs is always-on; gold_share does not use geometry.rs which is the sink_aware_attn-gated part). Opt-in diagnostic.
gaussianity_probe = []  # Sketched Gaussianity Probe — multi-direction projection-normality for embedding populations (Issue 681, Research 498 — LeVLJEPA arXiv:2607.00784 SIGReg distilled from training loss to inference-time diagnostic). Cramér-Wold sketch: project n×d population onto 16 fixed directions (4 coordinate-axis anchors + 12 BLAKE3-derived Rademacher), KS-vs-fitted-Gaussian per direction (bit-identical port of katgpt-spectral ks_d_statistic — the leaf constraint forbids the dep, the cross-crate agreement test in katgpt-spectral pins them together), sigmoid aggregate over the n-aware Kolmogorov min-p. Catches the bimodal / heavy-tail / discrete marginals that pass every second-moment metric (erank, within_class_erank, spectral_flatness) — the non-redundancy pin lives in bench_681. Consumers: band_conditioner Fisher-z guard, riir-ai #743 edge_lora monitor, riir-neuron-db freeze-gate advisory. Pure modelless (KS + sigmoid + BLAKE3 table); zero-alloc after GaussianityScratch::new (G4). Opt-in until a consumer promotes — diagnostic with GOAT gate (.benchmarks/673).
svd_cca = ["newton_schulz", "subspace_phase_gate"]  # SVCCA — SVD-denoised CCA subspace similarity (Issue 684, Research 501 — arXiv:1706.05806 Raghu et al. NIPS 2017). data_probe::cca::{svcca_into, CcaReport, CcaScratch}: column-center both sides → covariance + linalg::symmetric_eig (f64) → numerical_rank(√λ, η=0.99) denoise truncation (the paper's load-bearing step) → project to the retained subspaces → ridged covariances → ns_inv_sqrt_psd_into whitening (fixed 7 NS iters) → B-form eigenproblem B = Wx·Cxy·Wy, M = B·Bᵀ → symmetric_eig → ρᵢ = √clamp(λᵢ,0,1), ρ̄ = mean over min(kx,ky). Affine-invariant (sample permutation / feature scaling / invertible feature mix), degenerate inputs are the collapse SIGNAL not an error (guard form !is_finite() || < floor — Batch-54), fixed iteration counts → bit-deterministic, zero-alloc steady state (G4). Consumers waiting: riir-neuron-db can_freeze v2 (ρ̄ convergence gate), riir-ai LoRAHotSwap semantic-equivalence gate + cross-NPC belief alignment, riir-train Plan 349 (already filed). HONEST DEVIATIONS (measured, bench 674): "thin SVD each" realized as the algebraically-identical covariance+eig composition (thin_svd_into measures 741 µs/side on the 128×32 fixture vs ~50 µs for cov+eig — ~15× faster, rank-selection parity pinned by a G1 test); G2 recalibrated 25 µs → 250 µs (one 32×32 symmetric_eig alone costs ~48 µs — the mandated substrate floor makes 25 µs structurally unreachable; consumers are Warm/Glacial-cadence). Opt-in per the no-default-consumer rule (T6).
knn_entropy = []  # kNN differential-entropy estimator — Kozachenko–Leonenko Ĥ = ψ(n) − ψ(k) + ln c_d + (d/n)·Σ ln εₖ(i) over point-latent populations (Issue 708 P1, distilled from Research 437 / arXiv:2608.29335 GenFirst's two-channel collapse law). data_probe::entropy::{knn_differential_entropy, KnnEntropyScratch, digamma, ln_euclidean_unit_ball_volume}: the uncertainty/entropy axis beside the shipped dispersion proxies (effective_rank, gaussianity, spectral_flatness) — none produce nats. Brute-force O(n²·d) by design (offline audit cadence, n ≤ a few thousand), bounded max-heap O(k) scratch (sift-up fill + replace-root), f64 accumulators, deterministic ×3, zero steady-state allocs (G4 by construction), duplicates ⇒ −∞ (the collapse signal, consumed by P2's monitor not clamped here). Gates: G1 closed-form calibration (isotropic Gaussian d4 ±0.35 / d8 ±0.9 nats) + monotone-under-shrink + planted rank-1 collapse trip (−27.6-nat drop) + digamma/ball-volume known-answer pins; G2 offline-scale smoke (n=2048,d=16). Classic prior art (KL 1987; Beirlant et al. 1997) — an IMPORT; zero corpus hits at filing. Opt-in `knn_entropy` until P2 (the two-channel imbalance monitor, channel A) or a dist-guard axis lands (no-default-consumer rule).
imbalance_monitor = ["knn_entropy"]  # Two-channel imbalance collapse monitor (Issue 708 P2, Research 437 — arXiv:2608.29335 GenFirst two-channel collapse law): data_probe::imbalance::{ImbalanceMonitor, ImbalanceConfig, ImbalanceReading} — channel A = knn_differential_entropy (spread, nats), channel B = strided-pair mean |cosine| (directional concentration, scale-invariant), conjunctive z-score alarm `a_z ≤ −k_a && b_z ≥ +k_b` against a Welford warm-up-frozen baseline. The delta over the shipped detectors (cgsp EntropyCollapse `entropy < tau_low`, S2F hesitation counting, erank/gaussianity floors — all ABSOLUTE) is balance-vs-absolute: deviation-from-baseline crosses early in a degradation while the level must traverse healthy→collapsed, giving measured detection lead time (bench_708_imbalance_goat on the bench_681 fixtures: lead ≥ 1 cycle everywhere, monotone in severity, sub-threshold severities detected that absolute never sees, healthy specificity zero false alarms) + the honest scope boundary pinned in-module: ISOTROPIC contraction leaves channel B flat (scale-free) so the conjunction does not fire — directional/mode collapse is this monitor's regime, isotropic drift belongs to the absolute/derivative channels. Event-triggered reporting only — never a closed-loop controller (the paper's own Table 2 shows PI-adaptive collapse; Research 437 §transfer boundary). Deterministic ×3, zero steady-state allocs (owned KnnEntropyScratch + arithmetic; Copy reading), duplicates ⇒ −∞ propagate honestly. First consumer: katgpt-pruners `population_collapse` advisory latch on S2FCollapseDetector; stays opt-in until a default-build consumer promotes.
mi_est = ["gaussianity_probe"]  # mi_est — Modelless Mutual-Information Estimator over FIXED critics (Plan 583, Research 521 — MINE arXiv:1801.04062 modelless extraction; src/mi/). DV/NWJ/InfoNCE-K/JS bound VALUES in nats from ONE score pass (scratch-resident joint/perm score buffers + BLAKE3-seeded permutation RNG; logmeanexp max-subtracted — no softmax); LOO bias control (bias ≤ C·dof/N recorded null-calibration curve); K-ladder tightness diagnostic (critic_headroom saturation gap); permutation test distribution-free + finite-sample exact (uniform / circular for tick streams / block / stratified for I(X;Y|Z); antithetic σ,σ⁻¹ Q-term pairing; Median/Max/BlockNce/dCor² statistics — dCor characteristic so the Y=X² non-vacuity control FIRES where the bilinear critic is blind); Gaussian closed-form arm gated by the shipped sketched_gaussianity probe (NotGaussian routes to the critic/perm arms, never silently swallowed); frozen-representation IB ratio Î(T;Y)/Î(X;T) + Pareto ranker. Zero training, zero GD, no learned params — modelless by construction. Consumers: riir-train edge_lora_dist_guard third audit axis (T3.4, plan 365 consumes the DV core), offline quant-fidelity probes (T3.5). Opt-in per the no-default-consumer rule — promotion only after T3.4/T3.5 consumer GOAT gates. Implies gaussianity_probe (the Gaussian-arm gate); pulls linalg::symmetric_eig for the eigendecomposition logdets (same cfg-any rule as svd_cca).
