karc_forecaster = []  # KARC — Kolmogorov-Arnold Reservoir Computing delay-basis-ridge forecaster (Plan 308, Research 288, arXiv:2606.19984 Huang/Kurths/Tang). Modelless, inference-time trajectory forecaster: delay-embedding × sealed KarcBasis (Fourier/Chebyshev/BSpline) × closed-form ridge readout. Reuses the PEIRA ridge pattern via the new `linalg::ridge_solve` (f32) without touching PEIRA's f64 path. GOAT-gated G1 (double-scroll NRMSE ≤ 1e-3, ≥ 8 LT), G2 (≤ 500 ns/call forecast), G3 (zero-alloc forecast), G4 (bit-reproducible Wout). G2/G3/G4 PASS at 381 ns/call + zero-alloc + bit-reproducible. **DEFAULT-ON (Phase 22, 2026-07-21, Issue 186 Path D3 split-config gate).** G1 promoted under the split-config contract (.benchmarks/308_karc_goat.md §Phase 5.3): NRMSE PASS at K=8/M=8/R=2 λ=5e-2 (9.43e-4) + 2 more R=2 configs (K=10/M=8/R/2 λ=5e-2 8.83e-4, λ=1e-1 7.86e-4); threshold PASS at K=8/M=24/R=1 λ=5e-3 (8.16 LT). Both passing configs sit at the same K=8 delay length. The compound gate (both legs in ONE config) is structurally infeasible — NRMSE requires R=2 (cross-coordinate coupling for double-scroll v1-v2-i nonlinearity); threshold requires M≥24 (basis capacity for long rollout); R=2 × M=24 → d_h ≥ 166_752 (Gram ≈ 222 GB). Phase 5.3 closed the last escape hatch by showing R=1 has a hard NRMSE floor at ~5e-3 regardless of λ. Pure modelless (no training, no gradient descent). Zero runtime cost unless a caller constructs a KarcForecaster.
