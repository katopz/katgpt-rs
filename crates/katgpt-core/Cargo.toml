engram_privilege = ["engram"]  # Counterfactual privilege gating for engram fusion (Issue 656, riir-train Research 419 §5.2 LOPD modelless corollary, arXiv:2608.13040). Closes the similarity-only blind spot: the shipped gate asks "is this memory relevant?" but never "does fusing it improve the consumer's prediction?" (canonical symptom — `fuse_zero_query_does_not_corrupt_hidden_state`: q=0 → gate=σ(0)=0.5, so every populated slot fuses at half strength regardless of utility). Adds a multiplicative utility axis: `out = (base_gate · σ((Δ_slot − m)/s)) · v` where `Δ_slot ← (1−α)Δ + α·A·δ` and `δ = score(state + contribution) − score(state)`. MODELLESS — two evaluations and a comparison, zero GD; the ledger is runtime latent state like a routing table. `PrivilegeLedger` is a SIDE-CAR indexed by slot, NOT a table field: `InMemoryEngramTable` stays frozen + BLAKE3-committed (no commitment poisoning, no freeze/thaw version bump, composes with every EngramTable impl). Hot path adds one array read + one fast_sigmoid + one SCALAR multiply per head (`sigmoid_fuse_scaled_into` folds the factor into the gate, not a second D-element pass); counterfactual scoring is amortized off the hot path and budget-limited by the `gate_floor` gate-on-gate. Opt-in — see .benchmarks/656_engram_privilege_goat.md for the G1–G4 verdict and the scope limit.
