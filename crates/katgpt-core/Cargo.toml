phase_rotation_coupling = []  # Phase-Modulated Subspace Rotation Gate — norm-preserving latent coupling `cos α ⊙ a + sin α ⊙ b` with phase from a sigmoid projection onto a frozen direction vector (Plan 322, Research 305, arxiv 2605.12700 UFO). The genuinely-new operation class: every other latent op in the crate is additive / convex-combo / dot-projection / wedge-detection / linear-transport / spatial-sum — none has the `sin²α+cos²α=1` Pythagorean norm-preservation invariant. §3.5 modelless Path 2 unblock: trained γ_θ replaced with `α = sigmoid(⟨state, direction⟩ · λ) · π/2` (closed-form). DEFAULT-ON (Plan 322 Phase 2, 2026-06-25): G1 per-channel Pythagorean drift 5.96e-8<1e-4, G2 0 reversals across 100-step sweep (monotone), G3 D=8 scalar+mix 18.9ns<50ns + D=64 per-channel+mix 355.7ns<1500ns, G4 0 allocs/100 calls, G6 sigmoid(0)=0.5→cos=sin=1/√2 confirmed.
spherical_steering = []  # Spherical Steering — single-target geodesic Slerp rotation `sin((1−t)θ)/sin θ · ĥ + sin(tθ)/sin θ · μ_T` of a latent vector toward a unit-norm target direction on S^{d-1}, with sigmoid-translated vMF confidence gate (Plan 405, Research 382, arxiv 2602.08169 You/Deng/Chen ICML 2026). Sibling to Plan 322's 2-subspace phase rotation — same norm-preservation thesis, different parameterization: Plan 322 rotates *within* the (a,b) plane (Pythagorean identity); Plan 405 rotates *toward* a target outside the input's direction (Slerp identity `‖c0·ĥ + c1·μ_T‖ = 1` for all θ ∈ (0,π)). Use case: pull a drifted vector back toward a committed archetype direction (F1 fusion hook). vMF gate reduces to sigmoid via Eq 17: `δ = -tanh(κ·s_T) = 1 − 2·sigmoid(2κ·s_T)`. §3.5 modelless Path 3 (closed-form trig + sigmoid; no training). DEFAULT-ON (Plan 405 Phase 2+3, 2026-07-06): G1–G6 all PASS — see the DEFAULT-ON comment above for the full gate summary.
sphere_sampling = []  # Sphere Sampling — modelless primitives for sampling from unnormalized densities on S^{d-1} (Issue 544, Flow Sampling arxiv 2605.03984 Havens/Karrer/Shaul FAIR+Weizmann May 2026). Three primitives: parallel_transport_householder_into (Eq 42 Householder reflection about the midpoint hyperplane X_1+X_t), jacobian_logdet_cot_correction (Eq 44 curvature score correction `(d−1)·(t·cot(t·ω_1) − cot(ω_1))·Ẋ_1/ω_1`), sphere_exp_map_into (Riemannian exp `cos(‖v‖)·X + sin(‖v‖)·v/‖v‖`, the Euler–Maruyama step from Eq 29). For vMF-family targets the entire conditional drift is closed-form — no learned u_θ. Sibling of spherical_steering (Plan 405): Plan 405 deterministically pulls a drifted vector toward μ_T via Slerp + Eq-17 gate; this module samples a distribution over directions on S^d via Euler–Maruyama on the manifold. The deterministic gate produces one direction; sampling produces a distribution — a capability class the gate cannot serve. Opt-in pending Issue 544 defend-wrong PoC verdict: the most likely failure mode (per Research 049 PTRM cautionary flag) is that the Riemannian sampler produces the same KL as Wood (1994)'s exact vMF sampler at the same N — in which case the Riemannian complexity is unjustified for the vMF-only case. Promotion requires a non-vMF consumer where the Riemannian machinery strictly dominates Wood.
subspace_steering = ["latent_field_steering"]  # Subspace Steering Field — k-dim manifold steering (Plan 412, Research 393, arxiv 2606.25234 Goodfire BSF). The k-dim generalization of Plan 309: an orthonormal block `{u_1..u_k}` + per-axis strengths `{α_1..α_k}`, math `s' = s + Σ_j α_j · u_j`. At K=1 bit-identical to Plan 309; at K≥2 enables manifold walking (sweep alphas over a grid → concept variations). Pure modelless consumer of pre-discovered blocks. Implies latent_field_steering (K=1 parity gate reference). NOTE: Phase 3 `from_directions_orthonormalize` uses Gram-Schmidt, NOT Newton-Schulz — NS diverges on non-square K<D matrices (Plan 412 Phase 3 finding, 2026-07-08). DEFAULT-ON (Plan 412 Phase 5, 2026-07-08): G1+G3+G4+G5 ALL PASS. At K=1 bit-identical to Plan 309 (0 mismatches / 800 comparisons).
region_subspace_steering = ["subspace_steering"]  # Region-Conditioned Subspace Field — MFA local-geometry steering (Plan 416, Research 396, arxiv 2602.02464 Shafran et al. "From Directions to Regions"). The region-conditioned generalization of Plan 412: K regions, each with a centroid μ_k and a local R-dim factor-analyzer subspace W_k. Two-mode steering: centroid interpolation (move toward a region) + local subspace offset (walk within a region). Per-region sigmoid membership gates (reformulated from softmax responsibilities per AGENTS.md — more expressive: multi-region membership). Pure modelless consumer of a frozen MFA-like artifact {μ_k, W_k, Ψ, π} (trained offline via riir-train GD, or deterministically constructed via K-means + per-region PCA). At the degenerate limit (K=1, μ=0, W=I) steer_local is bit-identical to Plan 412. Implies subspace_steering (K=1 parity gate reference). DEFAULT-ON (Plan 416 Phase 4, 2026-07-09): G1+G2+G3+G4+G5 ALL PASS. At degenerate K=1,mu=0,W=I bit-identical to Plan 412 (0 mismatches / 800 comparisons).
