[package]
name = "katgpt-attn"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Attention stack primitives — GDN2 kernels, DashAttention, Chiaroscuro, RAT+ Bridge, EGA, StaticCal, DiagonalGate, FuncAttn composition. Extracted from katgpt-rs/src/ (Proposal 003 Phase 2)."
repository = "https://github.com/katopz/katgpt-rs"
publish = false

[dependencies]
katgpt-core = { path = "../katgpt-core" }
# katgpt-forward + katgpt-transformer (Issue 007 Phase F.4a, 2026-07-02):
# the gdn2/forward.rs + dash_attn/forward.rs composition layers moved here
# from root. Activated by `gdn2_attention` / `dash_attn` features respectively
# (the forward modules live inside those feature-gated parent modules).
katgpt-forward = { path = "../katgpt-forward", default-features = false, optional = true }
katgpt-transformer = { path = "../katgpt-transformer", optional = true }
# katgpt-spectral: needed by funcattn_compose/spectral_pre_rotate (calibrate_eigenbasis).
# Optional — only pulled when the funcattn_spectral_pre_rotate feature is on.
katgpt-spectral = { path = "../katgpt-spectral", optional = true }
# katgpt-pruners + katgpt-kv: needed by the Phase 12 VortexFlow cluster
# (meta_router imports katgpt_pruners::bandit; sat_analysis imports
# katgpt_kv::cache_prune::SummedAreaTable). Optional — only pulled when the
# `dash_attn` feature is on (the cluster's parent module gate).
katgpt-pruners = { path = "../katgpt-pruners", optional = true }
katgpt-kv = { path = "../katgpt-kv", optional = true }
# rustfft: DCT spectral entropy operator for Chiaroscuro attention.
rustfft = { version = "6.2", optional = true }
# blake3: commitment hashing for FuncAttn freeze/thaw snapshots + StaticCal tables.
blake3 = { version = "1.8", optional = true }
# serde: (De)serialization for FuncAttn freeze/thaw snapshots.
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
fastrand = "2"
serde_json = "1"

[features]
default = []
# GDN2 recurrent attention kernels (types + kernel) AND the composition layer
# (forward_gdn2, Issue 007 Phase F.4a). The forward module moved here from root;
# pulls katgpt-forward (ForwardContext) + katgpt-transformer (TransformerWeights).
gdn2_attention = ["dep:blake3", "dep:katgpt-forward", "dep:katgpt-transformer"]
# Wall Attention diagonal gate — shared DiagonalGate trait used by both GDN2
# and Wall attention. Gated alongside gdn2_attention / wall_attention in root.
diagonal_gate = []
# DashAttention clean core (entmax, routing, chunk_summary) AND the composition
# layer (forward_dash_attn_prefill / forward_dash_attn_decode, Issue 007 Phase
# F.4a) AND the Phase 12 VortexFlow cluster (vortex_flow, block_topk,
# channel_aware, entmax_router, kv_outer_prefill, msa_distill, value_energy,
# adaptive_k, meta_router, sat_analysis). The forward module pulls katgpt-forward
# (ForwardContext) + katgpt-transformer (TransformerWeights/MultiLayerKVCache);
# the VortexFlow cluster pulls katgpt-pruners (meta_router bandit dep) +
# katgpt-kv (sat_analysis SummedAreaTable dep).
# NOTE: forward_dash_attn_decode_vortex was STRIPPED — see dash_attn/forward.rs
# module comment. The token-level decode_vortex variant lives in root
# src/dash_attn/tests.rs (needs root transformer glue).
dash_attn = ["dep:katgpt-forward", "dep:katgpt-transformer", "dep:katgpt-pruners", "katgpt-pruners/bandit", "dep:katgpt-kv", "katgpt-kv/cache_prune", "dep:serde"]
# VortexFlow composable sparse routing (Plan 196). Sub-feature of dash_attn —
# gates the vortex_flow.rs/block_topk.rs/channel_aware.rs/entmax_router.rs/
# meta_router.rs/value_energy.rs primitives. Phase 12 (2026-07-04): these moved
# from root; the feature still exists for back-compat with root's feature chain.
vortex_flow = ["dash_attn"]
# MSA blockwise sparse distillation sub-features (Plan 256 GOAT gates).
# All imply vortex_flow (the parent cluster).
msa_sparse = ["vortex_flow"]
msa_per_group = ["msa_sparse"]
msa_kv_outer = ["msa_sparse"]
msa_adaptive_k = ["msa_sparse"]
# Chiaroscuro attention — per-token DCT spectral entropy operator routing.
chiaroscuro = ["dep:rustfft"]
# RAT+ Recurrence Bridge — modelless dilated inference via GDN2 state.
rat_plus_bridge = []
# Energy-Gated Attention — spectral salience gating.
ega_attn = []
# Static Calibration Tables — pre-computed per-head attention scales.
static_cal_tables = ["dep:blake3"]
# Plan 424 T4.2: GDN2 cache ↔ tree verify bridge adapter. Implies
# `gdn2_attention` (needs GDN2 types + forward composition) and forwards to
# `katgpt-core/gdn_tree_verify` (the rollback-free verify primitive).
gdn_tree_verify = ["gdn2_attention", "katgpt-core/gdn_tree_verify"]
# Plan 430: Dual-path GDN × HOLA tree verify bridge. Implies both parents.
gdn_hola_tree_verify = ["gdn_tree_verify", "hippocampal_cache", "katgpt-core/gdn_hola_tree_verify"]
# FuncAttn composition layer (Plan 286 Phase 5).
funcattn_freeze_thaw = ["dep:blake3", "dep:serde"]
funcattn_spectral_pre_rotate = ["dep:katgpt-spectral"]
funcattn_chiar_blend = ["chiaroscuro"]
# sparse_mlp: gates the `#[cfg(feature = "sparse_mlp")]` MLP path in
# gdn2/forward.rs. Forwards to katgpt-core (for sparse_matmul) and
# katgpt-forward (for ForwardContext.active_indices/active_values).
sparse_mlp = ["katgpt-core/sparse_mlp", "katgpt-forward/sparse_mlp"]
# HOLA Hippocampal Exact KV Cache integration (Plan 395, Research 378).
# Forwards to katgpt-core/hippocampal_cache. When active, Gdn2LayerState gains
# `hippocampal_caches: Vec<HippocampalCacheDyn>` (one per KV head, empty =
# disabled) that observes the delta-rule write magnitude (β·‖e‖) per token,
# plus `cache_scratch` and `cache_alpha` for the read path. The cache is a pure
# observer — it does not perturb the GDN2 state. Zero overhead when empty.
# Use `MultiLayerGdn2Cache::with_hippocampal_cache(config, w)` to enable.
hippocampal_cache = ["katgpt-core/hippocampal_cache"]
# Hierarchical Global Attention forward path (Plan 397, Research 379).
# Forwards to katgpt-core/hga. When active, provides `forward_hga` — the
# three-stage chunk→group→token routing path using dash_attn::entmax_1p5 for
# chunk selection + katgpt_core::hga::GroupSummaryCache for group selection +
# katgpt_kv::tiered_kv::TieredKvStore for route-and-fetch.
hga = ["katgpt-core/hga"]

# Gated MLP (SwiGLU) — LLaMA-style gated MLP variant (Issue 377).
# Forwards to katgpt-forward so ForwardContext.hidden2 resolves, and to
# katgpt-transformer so LayerWeights.mlp_w_up resolves. Gates the SwiGLU
# MLP path in gdn2/forward.rs, gdn2/tree_forward.rs, and dash_attn/forward.rs.
gated_mlp = ["katgpt-forward/gated_mlp", "katgpt-transformer/gated_mlp"]
# MLA (Multi-head Latent Attention) — DeepSeek-V2 §2.1 + Appendix C.
# Implements the decoupled-RoPE latent attention from DeepSeek-V2 with the
# Kimi-K3 output-gate extension (Proposal 032 Phase 2, Research 327). Pulls
# katgpt-kv for RopeFreqs (the cached sin/cos RoPE substrate). Opt-in,
# default-off until Phase 6 real-model GOAT.
mla_attention = ["dep:katgpt-kv", "katgpt-kv/shard_kv"]
# MLA analytic backward pass (Plan 318 Phase C C4). The CPU reference for
# the GPU backward. Implies `mla_attention`. katgpt-rs is
# modelless-by-mandate — this is the training-time reference consumed by
# riir-train, never on the production inference path. Opt-in, default-off.
mla_backward = ["mla_attention"]
# KDA (Kimi Delta Attention) — Kimi Linear (arxiv 2510.26692) §3-4.
# Implements the per-token decode forward for KDA linear attention. The
# recurrent kernel is REUSED from `gdn2_attention` (Gdn2GateConfig::Kda);
# this feature adds the KDA-specific forward layer (projections + ShortConv1D
# + Swish + L2Norm + low-rank α + sigmoid β + output gate + head-wise RMSNorm).
# Proposal 032 Phase 4, Research 329. Opt-in, default-off until Phase 6 GOAT.
kda_linear = ["gdn2_attention"]
# KDA analytic backward pass (Issue 389 T4). The CPU reference for the GPU
# backward (Plan 318 Phase C C5). Implies `kda_linear`. katgpt-rs is
# modelless-by-mandate — this is the training-time reference consumed by
# riir-train, never on the production inference path. Opt-in, default-off.
kda_backward = ["kda_linear"]
# FlashMemory-style periodic sparse attention for MLA (Issue 584 Phase 1).
# Implements the lookahead periodic sparse selection from FlashMemory-DeepSeek-V4
# (arXiv:2606.09079, Research 436) adapted for Multi-head Latent Attention.
# Implies `mla_attention` (MLA types + forward) + `dash_attn` (VortexFlow scratch
# types). Opt-in, default-off until GOAT gate (Issue 584 Phase 3).
flashmemory_sparse = ["mla_attention", "dash_attn"]
# Issue 747 family gate (Research 549, arXiv:2506.16640) — the ASEntmax
# modelless-mining rows, one flag (P1 set the precedent of landing
# non-schedule rows under it):
# - P0: length-adaptive damping schedule `β·(log n_c)^{−0.5}` (Eq 10) — the
#   entmax-side mirror of katgpt-core's SSMax (one extreme-value law, two
#   signed arms). Implies `dash_attn` (the modules live in dash_attn/).
# - P1: Lemma-2 derived support budget `k̂ = 4/Δ̂²` (adaptive_k).
# - P2: theorem-backed ALiBi×entmax KV-eviction window (Prop E.2,
#   eviction_window.rs — bit-identity gate).
# - P3: Lemma-1 incremental decode entmax (entmax_incremental.rs —
#   O(1) below-τ pushes, bit-exact vs full resort).
# Opt-in until the per-row Issue 747 GOAT gates; split is mechanical if a
# promotion ever needs to demote a subset.
asentmax_schedule = ["dash_attn"]
# Trained dual-encoder indexer for FlashMemory (Plan 337 Phase B). Two tiny
# MLPs (Q-Indexer + K-Indexer) that replace the modelless centroid-dot scorer.
# Requires training (riir-train Plan 337) → NEVER default-on (modelless-first
# mandate). The modelless FlashMemorySelector is the production default.
trained_indexer = ["flashmemory_sparse"]

# ── Issue 713 T2: `required-features` on `#![cfg]`-gated GOAT gates ─────────
#
# Every target below opens with a whole-file `#![cfg(feature = ...)]`. Without
# the row, `cargo test --test <name>` compiles it to an EMPTY binary and prints
# `running 0 tests` / `ok. 0 passed` with exit 0 — indistinguishable from a real
# pass, on the gates whose green IS the evidence for a promotion.
#
# The `#![cfg]` protects the COUNT. This protects the READER. Both are needed.
#
# `cargo test --workspace` is UNAFFECTED: cargo silently skips a target whose
# required-features are off, so this cannot red an existing workspace CI. What
# changes is that naming the target without its features now errors (exit 101)
# instead of reporting a green zero.
#
# Measured population + the instrument: `.docs/10_audits/cfg_gated_silent_zero_pass.md` (Issue 713, closed + removed 2026-09-03), scripts/cfg_gated_target_audit.py

[[test]]
name = "kda_g1_spec_match"
required-features = ["kda_linear"]

[[test]]
name = "mla_g1_spec_match"
required-features = ["mla_attention"]

# Issue 713 (2026-09-03): armed after the load-bearing classifier was widened
# to see the alloc / correctness / determinism / equivalence / floor / grad
# naming dialect. Each of these reported `ok. 0 passed` when named without
# its feature; they now error with exit 101 instead.

[[test]]
name = "kda_backward_grad_check"
required-features = ["kda_backward"]

[[test]]
name = "mla_backward_grad_check"
required-features = ["mla_backward"]

# Issue 747 P0 — ASEntmax G1 stationarity gate (scaled-range n-invariance,
# support σ-invariance, unscheduled collapse counterfactual, simplex +
# exact-zero preservation). Opens with `#![cfg(feature = "asentmax_schedule")]`.
[[test]]
name = "asentmax_g1_stationarity"
required-features = ["asentmax_schedule"]

# Issue 747 P0 — ASEntmax G4 zero-alloc gate. Separate test binary (the
# karc_alloc_check convention): the CountingAllocator must not pick up
# allocations from parallel tests.
[[test]]
name = "asentmax_alloc_check"
required-features = ["asentmax_schedule"]

# Issue 747 P1 — derived-k budget G1 length-independence gate (Lemma-2
# boundary law: realized support == k̂ = 4/Δ̂² at every n ∈ 1k..1M).
[[test]]
name = "asentmax_p1_derived_k_g1"
required-features = ["asentmax_schedule"]

# Issue 747 P2 — eviction-window G1 bit-identity gate (Prop E.2: support
# ⊆ window, evicted probs exactly 0.0, windowed-vs-full bit-identical).
[[test]]
name = "asentmax_p2_eviction_g1"
required-features = ["asentmax_schedule"]

# Issue 747 P3 — incremental decode entmax G1 gate (Lemma 3.1: incremental
# == full re-sort bit-exact, incl. threshold-brushing adversarial streams).
[[test]]
name = "asentmax_p3_incremental_g1"
required-features = ["asentmax_schedule"]

# Issue 747 P3 — G4 zero-alloc gate (below-τ steady state at capacity).
# Separate binary (the CountingAllocator must not pick up parallel tests).
[[test]]
name = "asentmax_p3_alloc_check"
required-features = ["asentmax_schedule"]

# Issue 747 P0 — ASEntmax GOAT gate bench (G2 NIAH routing sweep at growing
# chunk counts, G3 no-regression at 256 chunks, latency). harness=false
# (std::time::Instant convention, mirrors bench_411).
[[bench]]
name = "bench_747_asentmax_goat"
harness = false
required-features = ["asentmax_schedule"]

# Issue 747 P0.7 — real-model fixture GENERATOR (Ternary-Bonsai-8B qwen3
# prefill → routing rows + block summaries + ground-truth attention masses).
# Dev-tool: needs the real GGUF on disk; not part of any gate.
[[example]]
name = "asentmax_p07_gen_fixture"
required-features = ["asentmax_schedule"]

# Issue 747 P0.7 — real-model ASEntmax G2/G3 re-gate (replays the committed
# fixture through EntmaxRouter None vs with_asentmax_schedule).
[[test]]
name = "asentmax_p07_realmodel_regate"
required-features = ["asentmax_schedule"]
