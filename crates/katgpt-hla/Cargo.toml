[package]
name = "katgpt-hla"
version = "0.1.5"
edition = "2024"
license = "MIT"
description = "Higher-order Linear Attention (HLA) substrate — O(1) inference cache types and streaming kernels. Pure substrate, depends only on katgpt-types (Config + SIMD)."
readme = "README.md"
repository = "https://github.com/katopz/katgpt-rs"
keywords = ["attention", "linear-attention", "hla", "inference", "modelless"]
categories = ["algorithms", "science"]
# Published to crates.io (katgpt-core dependency)

[dependencies]
# katgpt-hla is a pure substrate leaf — the only katgpt-* dependency is the
# shared types/SIMD leaf (Issue 007 Phase E Tier 2 #4). HLA's two external
# references are `Config` (head_dim / n_head / n_kv_head / n_layer) and the
# SIMD kernels used in the readout/update hot path. Both live in
# katgpt-types, so the whole crate compiles without katgpt-core.
#
# NOTE: forward_hla / forward_ahla (the composition layer) CANNOT live here —
# katgpt-core depends on katgpt-hla (substrate re-export), and the composition
# needs katgpt-forward (→ katgpt-core), which would create a cycle
# (katgpt-core → katgpt-hla → katgpt-forward → katgpt-core). The composition
# layer lives in katgpt-forward instead (Issue 007 Phase F.4b, 2026-07-02).
katgpt-types = { path = "../katgpt-types", version = "0.3.0" }

# Optional serde support (Issue 532 T1). Off by default so the substrate
# stays dependency-light for consumers that only need the math. Enable with
# `features = ["serde"]` to get `#[derive(Serialize, Deserialize)]` on every
# cache state struct. The riir-engine snapshot path (gated by `turso_cold`)
# uses this to bincode-serialize `MultiLayerHlaCache` for Cold Tier storage.
serde = { version = "1", features = ["derive"], optional = true }

# Optional novelty-gated decay (Plan 639 Phase 3 T3.3, Issue 1232). The law
# lives in katgpt-sense (`novelty_retention::NoveltyChannel`) and is CONSUMED
# here, never re-implemented. katgpt-sense is a katgpt-types leaf that does
# not reach katgpt-hla, so the edge adds no cycle; off by default, so the
# default dep graph is unchanged.
katgpt-sense = { path = "../katgpt-sense", version = "0.3.2", default-features = false, features = ["novelty_retention"], optional = true }

# Issue 940 HL-1/2/3 G2 duty — the ordered-fold cost at decode-loop scale.
[[bench]]
name = "bench_939_hla_ordered_dot_g2"
harness = false

[features]
# katgpt-hla compiles its entire substrate (types + kernel) unconditionally.
# HLA substrate is always-on inside katgpt-core (mirrors the pre-promotion
# behavior where `pub mod hla;` was unconditional). The composition layer
# (`forward_hla` / `forward_ahla`) lives in katgpt-forward (Issue 007 Phase
# F.4b); the cognitive extensions (`*_role_aware`, `ThirdOrderMoment`) stay
# in riir-engine because they depend on `role_transport`.
#
# `serde` (opt-in, Issue 532 T1): adds `#[derive(Serialize, Deserialize)]` on
# every cache state struct. Required by riir-engine's snapshot module
# (bincode-based Cold Tier persistence, gated by `turso_cold`).
default = []
serde = ["dep:serde"]

# `novelty_gamma` (opt-in, Plan 639 T3.3 / Issue 1232): `HlaNoveltyGamma` — a
# per-cache novelty gate on the decay γ (sustained query-regime change pulls
# γ down, a one-tick outlier pushes it up). Per-instance ARMED; unarmed = the
# caller's fixed γ (incumbent path untouched). LOCAL latent state only.
# CLOSED NEGATIVE (Issue 1232): G2 0/36 cells under the Plan 639 T2.2 verdict
# (gated cells ride the fixed-γ curve), G3 PASS (median Δ 7.87 ns, hd=8, bmo),
# G1/G4 PASS — opt-in forever unless a re-gate passes G2.
novelty_gamma = ["dep:katgpt-sense"]

[[test]]
name = "novelty_gamma_goat"
required-features = ["novelty_gamma"]
