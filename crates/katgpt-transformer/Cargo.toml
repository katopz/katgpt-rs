[package]
name = "katgpt-transformer"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Transformer substrate types (weights, KV caches, contexts) shared between katgpt-rs and riir-engine"
repository = "https://github.com/katopz/katgpt-rs"
readme = "README.md"
keywords = ["transformer", "inference", "weights", "kv-cache", "modelless"]
categories = ["data-structures", "science"]
publish = false  # only katgpt-core ships to crates.io

[dependencies]
# Pure substrate types — depends only on katgpt-core for Config / Rng / math / SIMD kernels.
# No transformer-forward composition logic lives here (that stays in katgpt-rs root).
katgpt-core = { path = "../katgpt-core" }
rayon = "1.10"
blake3 = "1"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }  # extern_crate_alloc: enables pod_collect_to_vec for MTP projection binary loader
# ArrayVec for PagedKVCache::ensure_pages/rollback stack-allocated scratch
# (zero heap alloc, bounded to 128 layers). Ported from riir-engine.
arrayvec = "0.7"
# Phase 9: dense_mesh's edge_bandit + edge_projection use fastrand.
fastrand = "2"
# Issue 145: load_binary_bits constructs half::f16 group scales directly.
half = "2"

[features]
# All features default-on to match the historical katgpt-rs root behavior —
# downstream consumers (riir-engine) opt OUT of features they don't want.
default = ["wall_attention", "delta_routing", "decode_specialize", "plasma_path", "kog_cpu_fusion"]

# Kog AI monokernel CPU fusion — RMSNorm gamma folding + QKV interleaving (Plan 160).
# Gates: LayerWeights.attn_norm_gamma / mlp_norm_gamma / attn_qkv_fused fields,
# and TransformerWeights::fold_gamma / interleave_qkv methods. Consumers that
# don't use Kog fusion (riir-engine) disable this to get the compact 6-field
# LayerWeights and avoid ~2×n floats/layer of dead weight.
kog_cpu_fusion = []

# Wall Attention gate projection weights (Plan 173).
# Gates: LayerWeights.attn_wg field, WallPrefixState, GateStatistics.
wall_attention = []

# Delta routing block-delta accumulation (Plan 097).
# Gates: TransformerWeights.delta_routing_query / delta_routing_norm fields.
delta_routing = []

# Decode-stage specialized forward paths (Plan 102: TileRT pipeline).
# Gates: DecodeStage enum.
decode_specialize = []

# Bit-plane ternary SIMD matvec loader (Plan 148, Research 110).
# Gates: load_ternary_bits function in contiguous.rs.
# ⚠ MEASURED (Issue 843, 2026-09-19): the ternary dense matvec is 1.9–3.0×
# slower than the f32 matvec at every served shape (L3-resident operands);
# the win is the 21× weight footprint. T4 owner call: per-shape dispatch
# (katgpt-types::simd::plasma_dispatch — f32 below the L3 boundary, ternary
# above) for callers holding both representations.
plasma_path = []

# Binary plasma loader (Issue 145, Bonsai 27B). Gates: load_binary_bits in contiguous.rs.
# Forwards to katgpt-core so BinaryWeights resolves.
binary_plasma = ["katgpt-core/binary_plasma"]
# Issue 578: the Q2_0_g128 container (ternary bit-planes + per-128 f16 scale).
ternary_group_scale = ["katgpt-core/ternary_group_scale", "binary_plasma"]

# ── Phase 9 absorptions (Proposal 003) — modules moved from katgpt-rs root ──

# Memory Bandwidth Utilization diagnostics (Plan 160 T9). Folded under the
# existing kog_cpu_fusion feature because that's the gate the root used;
# no separate `mbu` feature exists.
# (mbu is gated by kog_cpu_fusion above — no new feature line needed.)

# Training-Free Loop Wrapper — ODE-refined sub-stepping (Plan 136).
# No internal deps; `recfm` and `thinking_prune` are no-op aggregator gates
# here (the recfm-accelerated functions and the pruner-schedule function both
# stay inside this module, but the pruner schedule function itself was moved
# to the katgpt-rs root shim to avoid a katgpt-pruners ↔ katgpt-transformer
# package cycle).
tf_loop = []

# RecFM acceleration-bounded sub-stepping (Plan 168 T2). No-op gate here —
# the substrate is local; root forwards here for feature aggregation.
recfm = []

# Thinking Prune gate (Plan 171). No-op here — the actual
# `should_apply_pruner_at_iteration` function lives in the root shim because
# it consumes `katgpt_pruners::PrunerSchedule` (and katgpt-pruners depends on
# katgpt-transformer, blocking the reverse dep).
thinking_prune = []

# DenseMesh latent node network (Plan 266, Research 234). EXPERIMENTAL —
# gate 2 failed empirically, demoted from GOAT-gated.
# `node_transformer.rs` stays in katgpt-rs root (consumes `forward`).
dense_mesh = []

# SwiR Switch-Thinking controller substrate (Plan 275, Research 241).
# Phase 12 T4.6 (2026-07-04): strategy_adapter moved here from root (thinking_cot cycle resolved).
swir_switch_thinking = ["thinking_cot"]

# Plan 626: SwiR anchor-exit — boundary-argmax span termination beside the
# entropy-trend law. Implies the SwiR substrate; flag-OFF compiles to nothing.
swir_anchor_exit = ["swir_switch_thinking"]

# Thinking CoT — adaptive thinking controller (Plan 194). Phase 12 T4.6
# (2026-07-04): module moved here from katgpt-rs root. strategy_adapter depends on it.
thinking_cot = []

# DenseMesh adaptive width controllers.
# `collapse_aware_thinking` forwards to katgpt-core so the `CollapseDetector`
# trait is present (consumed by `dense_mesh/adaptive_width.rs::collapse_signal`).
# `breakeven_routing` is a no-op here — the code path uses only local types
# (`BreakevenSnapshot`), no external symbols. Both root forwards.
collapse_aware_thinking = ["katgpt-core/collapse_aware_thinking"]
breakeven_routing = []

# Gated MLP (SwiGLU) — LLaMA-style gated MLP variant (Issue 377).
# Gates: LayerWeights.mlp_w_up field (the "up" projection; mlp_w1 becomes
# W_gate, mlp_w2 becomes W_down). When enabled, the forward path uses
# SwiGLU: SiLU(W_gate·h) ⊙ W_up·h → W_down·hidden. Opt-in — not default
# because the standard ReLU MLP is the production path; gated MLP is a
# training-target architecture for aHLA MLP LoRA (Plan 066 Experiment E).
gated_mlp = []

# Transformer-level FFN MoE (DeepSeek-V3 fine-grained MoE + noaux_tc).
# Proposal 032 Phase 3, Research 328. Implements the auxiliary-loss-free
# load balancing from DeepSeek-V3 §3.3 (per-expert bias participates in
# top-K selection only; raw sigmoid scores drive renormalization).
# Opt-in — promotion requires Phase 6 real-model GOAT; MoE FFN is a model
# architecture choice, not a modelless gain over existing substrate.
transformer_moe = []

# MoE analytic backward pass (Plan 318 Phase C C4). The CPU reference for
# the GPU backward. Implies `transformer_moe`. katgpt-rs is
# modelless-by-mandate — this is the training-time reference consumed by
# riir-train, never on the production inference path. Opt-in, default-off.
moe_backward = ["transformer_moe"]

# Attention Residual Block — Kimi-K3 block-residual softmax mixing.
# Proposal 032 Phase 5 prerequisite, Research 330 §5. Implements the
# `_apply_attn_res` mechanism that wraps around BOTH attention and MLP in
# every decoder layer when `attn_res_block_size` is set. Opt-in —
# promotion requires Phase 6 real-model GOAT.
transformer_attn_res = []

# ── Issue 713 T2: `required-features` on `#![cfg]`-gated GOAT gates ─────────
#
# Every target below opens with a whole-file `#![cfg(feature = ...)]`. Without
# the row, `cargo test --test <name>` compiles it to an EMPTY binary and prints
# `running 0 tests` / `ok. 0 passed` with exit 0 — indistinguishable from a real
# pass, on the gates whose green IS the evidence for a promotion.
#
# The `#![cfg]` protects the COUNT. This protects the READER. Both are needed.
#
# `cargo test --workspace` is UNAFFECTED: cargo silently skips a target whose
# required-features are off, so this cannot red an existing workspace CI. What
# changes is that naming the target without its features now errors (exit 101)
# instead of reporting a green zero.
#
# Measured population + the instrument: `.docs/10_audits/cfg_gated_silent_zero_pass.md` (Issue 713, closed + removed 2026-09-03), scripts/cfg_gated_target_audit.py

[[test]]
name = "attn_res_g1_spec_match"
required-features = ["transformer_attn_res"]

[[test]]
name = "bench_933_attn_res_decode_ab"
required-features = ["transformer_attn_res"]

[[test]]
name = "moe_g1_spec_match"
required-features = ["transformer_moe"]

# Issue 713 (2026-09-03): armed after the load-bearing classifier was widened
# to see the alloc / correctness / determinism / equivalence / floor / grad
# naming dialect. Each of these reported `ok. 0 passed` when named without
# its feature; they now error with exit 101 instead.

[[test]]
name = "moe_backward_grad_check"
required-features = ["moe_backward"]

# Issue 942: report-only latent pseudo-text trace demo (swir-gated).
[[example]]
name = "latent_readout_trace"
required-features = ["swir_switch_thinking"]
