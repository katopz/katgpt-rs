[package]
name = "katgpt-types"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "Shared configuration, RNG, math utilities, LoRA, domain embeddings, and inference types for katgpt-rs / riir-engine. Pure substrate leaf — no katgpt-* deps."
readme = "README.md"
repository = "https://github.com/katopz/katgpt-rs"
keywords = ["inference", "config", "rng", "lora", "modelless"]
categories = ["data-structures", "science", "algorithms"]
# Published to crates.io (katgpt-core dependency)

[dependencies]
fastrand = "2"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
half = "2"
rayon = "1.10"  # Parallel matmul variants in simd::dot and simd::ternary (always-compiled _parallel kernels).

[features]
# katgpt-types compiles its core substrate (config, rng, math, lora, enums,
# sense, looping, inference) unconditionally. The features below are empty
# tracking flags so katgpt-core can preserve its historical feature surface
# (`domain_latent` gates DomainLatent, `plasma_path` gates TernaryWeights,
# etc.) by forwarding them here. They gate nothing structural inside
# katgpt-types beyond the `#[cfg(feature = "...")]` re-export lines in
# lib.rs — mirroring the pre-promotion behavior where the whole `types`
# module compiled inside katgpt-core and these flags only controlled the
# re-export visibility.
default = []

# DomainLatent embedding type (Plan 038).
domain_latent = []

# GPart Isometric Partition adapter (Research 227).
gpart_adapter = []

# DataGate — task-level gating for self-play training stability (Plan 111).
data_gate = []

# SR²AM Configurator context types (Plan 112).
sr2am_configurator = []

# Hydra adaptive layer budget types (Plan 165).
hydra_budget = []

# DeltaNet layer type enum (Plan 182).
deltanet_inference = []

# Gemma 4 unified text model: ModelArchitecture::Gemma4 variant +
# Gemma4LayerType enum + Config::gemma4_12b() preset (Issue 577).
# Opt-in — gates the loader + forward pass in riir-engine.
gemma4_inference = []

# Ternary-weight inference: ModelArchitecture::Ternary variant.
# Gates the forward dispatch arm in riir-engine. The weight substrate
# (TernaryGroupWeights + simd_ternary_group_matvec) ships behind
# `ternary_group_scale` (Issue 578); this feature gates only the
# architecture enum + the riir-engine forward path. Plan 333 Phase 2.
# Renamed from `bitnet_inference` 2026-08-10 — the format is Q2_0_g128,
# not BitNet i2_s, and the whole substrate is named `ternary`.
ternary_inference = []

# Collapse-aware ThinkingBudget enum (Plan 212).
collapse_aware_thinking = []

# Wall Attention WallConfig (Plan 173).
wall_attention = []

# Sparse MLP matmul kernel (Plan 022).
sparse_mlp = []

# Bit-plane ternary weights for multiplication-free inference (Plan 148).
plasma_path = []

# Binary {−1,+1} plasma tier — single bit-plane, group-wise FP16 scale (Issue 145).
# Strict subset of ternary encoding (pos_bits = sign_bits, neg_bits = !sign_bits).
# The new Plasma tier; ternary (plasma_path) moved to Hot. STAYS OPT-IN by design
# (Issue 145 Phase 2 T2.4, 2026-07-15): GOAT gate PASSED, but promotion to default
# requires BOTH ≥1.5× latency AND ≥1.5× storage. Measured 1.22× latency (FAILS)
# + 1.82× storage (PASSES). Conjunction fails → binary remains opt-in for
# memory-constrained edge deployments.
binary_plasma = []
# Issue 578: ternary {-1,0,+1} bit-planes with per-128 f16 group scale — the
# Q2_0_g128 container (Ternary-Bonsai-27B). Implies binary_plasma for the shared
# GROUP_SIZE convention (single source of truth for the 128-weight group).
# G1-G4 GOAT gate ALL PASS (2026-08-12; Issue 578 closed and removed, content in
# .docs/08_performance/ternary_group_q2_0_tier.md). STAYS OPT-IN BY POLICY:
# promotion would transitively promote binary_plasma (opt-in by deliberate
# decision above), and the tier is a model-specific container 1.3x slower than
# the row-scale kernel — its win is memory traffic on Q2_0_g128 weights only.
ternary_group_scale = ["binary_plasma"]

# Issue 582: base-3 trit packing — 5 trits/byte + per-128 f16 scale = 1.75
# bits/weight vs the bit-plane tier's 2.125 (-17.6%, Bonsai-27B 7.17 -> 5.90 GB).
# Same alphabet, same group granularity; only the storage differs. Implies
# ternary_group_scale for GROUP_SIZE + the `from_group`/`to_group` repack.
ternary_trit_pack = ["ternary_group_scale"]

# Issue 845 (riir-ai) / arXiv:2609.00363: snap group scales to the nearest power
# of two at quantize time so scale application is EXACT on every backend
# (multiply/divide by 2^k is an exponent shift) — cross-backend bit-identity at
# the scale-application sites becomes REQUIRED, not measured. Requantizes from
# f32 parents (never reinterprets stored payloads). Implies ternary_group_scale
# (the construction it constrains).
pot_scales = ["ternary_group_scale"]

# MaxSim late-interaction scoring (Plan 080, Research 073).
maxsim = []

# Sigmoid margin loss + retrieval margin diagnostic (Research 123, Plan 157).
# Implies maxsim (mirrors the katgpt-core feature dependency).
sigmoid_margin = ["maxsim"]

# RiM Reasoning Buffer Slots config fields (Plan 172, Research 192).
rim_slots = []

# Loop stability mode for weight-shared looped inference (Plan 428).
# Gates the LoopStabilityMode enum + Config.loop_stability_mode field.
loop_stability_fix = []

# NextLat Belief-State Speculative Drafter config fields (Plan 217).
belief_drafter = []

# SIA FeedbackBandit enum variants (Plan 163, Research 033).
sia_feedback = []

# LinOSS Modal Threat Prediction sense fields (Plan 241).
spectral_threat = []

# GPart pruning stats (Plan 257 Phase 3 extension).
gpart_pruning = []

# Depth-Invariance Diagnostic + MagnitudeRegularizedResidual (Plan 306).
# Gates the depth_invariance module. Pure math (simd-only deps).
depth_invariance = []

# Issue 578 GOAT gates G2 (perf) + G4 (alloc-free) for the Q2_0_g128 tier.
# Needs plasma_path too: G2 compares against the row-scale ternary kernel.
[[test]]
name = "bench_578_ternary_group_goat"
required-features = ["ternary_group_scale", "plasma_path"]

# Issue 582 GOAT gates: G2 footprint (deterministic), G2b latency
# (informational, 2x reject bound), G1 cross-tier, G4 alloc-free.
[[test]]
name = "bench_582_trit_pack_goat"
required-features = ["ternary_trit_pack"]

# Issue 583 A/B: group scale hoisted vs folded in the bit-plane NEON kernel.
# Needs plasma_path only because the harness shares bench_578's feature shape.
[[test]]
name = "bench_583_scale_hoist_goat"
required-features = ["ternary_group_scale", "plasma_path"]

# ── Issue 713 T2: `required-features` on `#![cfg]`-gated GOAT gates ─────────
#
# Every target below opens with a whole-file `#![cfg(feature = ...)]`. Without
# the row, `cargo test --test <name>` compiles it to an EMPTY binary and prints
# `running 0 tests` / `ok. 0 passed` with exit 0 — indistinguishable from a real
# pass, on the gates whose green IS the evidence for a promotion.
#
# The `#![cfg]` protects the COUNT. This protects the READER. Both are needed.
#
# `cargo test --workspace` is UNAFFECTED: cargo silently skips a target whose
# required-features are off, so this cannot red an existing workspace CI. What
# changes is that naming the target without its features now errors (exit 101)
# instead of reporting a green zero.
#
# Measured population + the instrument: `.docs/10_audits/cfg_gated_silent_zero_pass.md` (Issue 713, closed + removed 2026-09-03), scripts/cfg_gated_target_audit.py

[[test]]
name = "bench_578_avx2_goat"
required-features = ["plasma_path", "ternary_group_scale"]

# ── katgpt-rs Issue 742: arm the auto-discovered gated targets ───────────────
# Each target below opens a whole-file `#![cfg(feature = ...)]` and had NO
# `[[test]]` row, so `cargo test --test <name>` without its features compiled
# the file to an EMPTY BINARY and printed `test result: ok. 0 passed`, exit 0 —
# byte-for-byte a real pass. The `#![cfg]` protects the COUNT (an ungated body
# would not compile); `required-features` protects the READER, and only the
# second is visible in the output. What changes: naming one WITHOUT its
# features now ERRORS instead of reporting a green zero.
#
# Rows are DERIVED from `scripts/cfg_gated_target_audit.py --json`
# (`silent_now_rows`), not hand-typed — a hand-typed row is the drift this
# class is about. None is load-bearing and none carries a platform predicate,
# so every one is fully expressible as `required-features`.

[[test]]
name = "capacity_break_point"
required-features = ["sigmoid_margin"]

[[test]]
name = "sigmoid_argmaxability"
required-features = ["sigmoid_margin"]
