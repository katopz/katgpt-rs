[package]
name = "katgpt-spectral"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Spectral quantization substrate — calibrated eigenbasis KV cache compression, Lloyd-Max / water-fill bit allocation, outlier-aware guard. Shared by katgpt-kv (ShardKV, KVarN) and non-KV consumers (funcattn_compose, chiaroscuro, benchmark). Spun out of katgpt-rs/src/spectralquant/ (Issue 015 Phase 2)."
repository = "https://github.com/katopz/katgpt-rs"
keywords = ["quantization", "spectral", "kv-cache", "lloyd-max", "modelless"]
categories = ["algorithms", "science"]
publish = false  # only katgpt-core ships to crates.io

[dependencies]
# SIMD kernels (simd_scale_inplace, simd_sum_sq) + types re-export.
katgpt-core = { path = "../katgpt-core" }
# Shared types (no KV-coupling; OutlierGuardConfig is re-exported from here
# via the local outlier_guard module — it lives with the code that consumes it).
katgpt-types = { path = "../katgpt-types" }
# TransformerWeights type referenced by outlier_guard.
katgpt-transformer = { path = "../katgpt-transformer" }
# SpectralKVCache parallel dequant kernels.
rayon = "1.10"
# f16 KV cache storage.
half = "2"
# Zero-copy Pod layout for calibration structs.
bytemuck = "1"
# serde impls for OutlierGuardConfig + calibration structs.
serde = { version = "1", features = ["derive"] }
# Diagnostics in outlier_guard / spectral.
log = "0.4"

# Optional: snapshot hashing in manifold_power_iter_router + off_principal
# (Phase 4 absorptions). Gated by the `manifold_power_iter_router` /
# `off_principal_retrieval` features.
blake3 = { version = "1", optional = true }

# RNG for peira's synthetic_cca_sample public API (Phase 4 absorption).
fastrand = "2"

# Uuid::now_v7() for EigenbasisProvenance.window_id (Phase 12 absorption —
# hla_eigenbasis.rs). Optional, enabled by `hla_eigenbasis_recovery`.
uuid = { version = "1", features = ["v7", "rng-getrandom"], optional = true }

[features]
# All flags are empty tracking gates mirroring the historical katgpt-rs
# feature surface. The root crate forwards them via
# `feature = ["katgpt-spectral/feature"]` so existing `#[cfg(feature = "...")]`
# branches inside the spectral code compile unchanged.
default = []

# Core spectral quantization flag (historical default-on at root).
spectral_quant = []

# Outlier-aware quantization guard (Plan 224). Gates outlier_guard.rs.
outlier_guard = []

# Cross-check with stiff_anomaly eigenvalue distribution.
# (Requires the consumer crate to also enable stiff_anomaly for the
# StiffSoftCrossCheck impl to mean anything — kept here as tracking flag.)
stiff_anomaly = []

# MaxSim late-interaction forward kernel.
maxsim = []

# Dual-gram PCA eigenbasis calibration.
dual_gram_pca = []

# TurboQuant random rotation export gate.
turboquant = []

# ── Phase 4 (Proposal 003) absorptions. Each forwards the substrate dep it
# needs (newton_schulz lives in katgpt-core; blake3 is an optional crate dep).

# Gauge-invariant adapter composition (Plan 270, Research 238) — LoRA-Muon
# distillation. Needs newton_schulz for the PSD inverse-sqrt path.
gauge_invariant = ["katgpt-core/newton_schulz"]

# Manifold Power Iteration MoE Router (Plan 279, Research 246). Needs blake3
# for snapshot hashing.
manifold_power_iter_router = ["blake3"]

# Calibrated-mass sigmoid top-k gate (Issue 880, Bench 884 candidate (a)):
# `gate_sigmoid_topk_mass_into` — the incumbent's logits + exact-k selection,
# weights re-biased by katgpt-core's `exact_mass_admit` so Σm = k. Opt-in:
# the router has no production consumer, so there is no gain to promote on.
calibrated_mass_gate = ["manifold_power_iter_router", "katgpt-core/exact_mass_admit"]

# Quantile Balancing MoE Router (Plan 455, Research 447 §2.4) — sibling to
# manifold_power_iter_router. One-shot per-expert bias `β` computation at
# freeze/thaw snapshot swap via alternating-coordinate descent on the
# balanced-assignment LP (Su blog Feb 2026 + Marin 32B-A5B validation). No
# deps — quantile via std::slice::select_nth_unstable. Promoted to
# DEFAULT-ON at root (2026-07-17) after Plan 455 Phase 3 Case C: composition
# with manifold_power_iter_router strictly beats either alone (MPI fixes
# alignment λ, QB fixes balance MaxVio on orthogonal axes).
quantile_balance_router = []

# Off-Principal Task Vector Retrieval (Plan 264 Phase 2, Research 231).
# Needs newton_schulz for the principal-direction recovery and blake3 for the
# source-weight hash. Also enables the local `newton_schulz` feature so the
# internal `#[cfg(feature = "newton_schulz")]` gate on `OffPrincipalIndex::new`
# resolves.
off_principal_retrieval = ["katgpt-core/newton_schulz", "blake3", "newton_schulz"]

# Spectral Budget Router (Plan 253, Research 222) — layer-adaptive NS depth.
# Tests exercise katgpt_core::newton_schulz directly and are gated by the
# local `newton_schulz` feature.
spectral_budget = ["katgpt-core/newton_schulz", "newton_schulz"]

# Orthogonal Procrustes cross-frame alignment (Issue 001).
orthogonal_procrustes = []

# River-valley diagnostic metrics (Plan 152, Research 114). Tracking flag
# for the internal `#[cfg(feature = "river_valley")]` gates on the public
# diagnostic functions; the module itself is always present.
river_valley = []

# Newton-Schulz orthogonalization passthrough. The substrate lives in
# katgpt-core; this alias lets the internal `#[cfg(feature = "newton_schulz")]`
# gates in `off_principal.rs` and `spectral_budget.rs` resolve. Always implied
# by `gauge_invariant`, `off_principal_retrieval`, and `spectral_budget`.
newton_schulz = ["katgpt-core/newton_schulz"]

# PEIRA modelless distillation (Plan 153, Research 115). Forwards the
# peira_distill flag on katgpt-core where the PeiraConfig/PeiraCovariance
# types live.
peira_distill = ["katgpt-core/peira_distill"]

# HLA Windowed Eigenbasis Recovery (Issue 001). Per-NPC eigenbasis recovery
# from a recent window of that NPC's own HLA activations — power iteration on
# D×D Gram, modelless. Phase 12 (2026-07-04): module moved here from
# katgpt-rs/src/hla_eigenbasis.rs; the historical `katgpt_rs::hla_eigenbasis`
# path is preserved via the root re-export.
hla_eigenbasis_recovery = ["uuid", "blake3"]

# ICA Lens — FastICA Non-Gaussian Direction Mining + ERF Diagnostic (Plan 475,
# arXiv:2606.11722, 2026-08-11). Training-free interpretability primitive
# that finds maximally non-Gaussian directions in activation windows via
# FastICA after centering + whitening. Consumes `EigenbasisScratch` as the
# whitening substrate. Sibling to `hla_eigenbasis_recovery` — ICA is the
# non-Gaussianity-maximizing rotation that complements PCA's
# variance-maximization. All 5 GOAT gates PASS (2026-08-11): G1 390µs ≤ 1ms
# (offline corpus fit), G2(a) 4.33× + G2(b) 6.26× kurtosis ratio vs PCA,
# G4 0 bytes alloc-free, G5 bit-identical determinism. Promoted to DEFAULT-ON
# at the root crate level (see root Cargo.toml `default` list).
ica_lens = ["hla_eigenbasis_recovery"]

# Issue 681 — cross-crate agreement test for katgpt-core's sketched
# gaussianity probe: core's `ks_d_vs_fitted_gaussian` (the verbatim port of
# this crate's `ks_d_statistic`, made because the katgpt-core leaf must not
# depend on katgpt-spectral — the rrq_quant scalar-inversion rule) must
# agree with the original on the same 1D samples. Test-only feature
gaussianity_agreement = ["katgpt-core/gaussianity_probe"]

# Spectral Rewiring — weight delta purification via base SVD projection
# (Plan 423, Research 406 — Zhang et al. arXiv:2607.03065). Projects ΔW onto
# W₀'s top-rank SVD subspace, extracting the compact rewiring matrix M = U_rᵀΔWV_r
# and the purified on-manifold delta ΔW* = U_r M V_rᵀ. The on-principal complement
# of `off_principal_retrieval` (Plan 264). Needs katgpt-core/subspace_phase_gate
# for thin_svd_into + SvdResultScratch + SvdScratch. STAYS OPT-IN (Plan 423 Phase 3
# GOAT, 2026-07-10): all mechanism gates PASS (G1a numerical stability, G2/G3/G4/G5/G6),
# but the spectral concentration assumption (G1b) does NOT hold at NPC scale (≤64×64)
# — verified via riir-train Issue 374 (trained LoRA deltas produce on_manifold_fraction
# in [0.27, 0.58], far below the SAR threshold > 0.8). Stays cold-tier only.
spectral_rewire = ["katgpt-core/subspace_phase_gate"]

# affinity_deflation (Issue 882 P4 rider (b) / Research 586, 2026-09-25):
# rank-1 spectral deflation A′ = A − λ·σ₁·u₁·v₁ᵀ = A − λ(A v₁)v₁ᵀ on a
# rerank-stage M×M candidate affinity, GATED on effective rank — the stable
# rank ‖A‖_F²/σ₁², which falls out of the σ₁ power iteration at O(M²) (no
# eigendecomposition) — deflate only when srank < θ, i.e. a COLLAPSED matrix
# (deflating a healthy one removes its strongest real cluster: the anti-help
# trap, pinned as a measured negative in Bench 897). Power iteration on AᵀA
# formed implicitly via the shared spectral_retract::power_iter_step; ‖Av‖
# lower-bounds σ₁ at every iterate, so non-convergence can only make the gate
# REFUSE. λ = 0 / refusal bit-identical; NaN refuses; caller-owned scratch,
# 0 allocs. θ by direct grid evaluation, never GD. OPT-IN.
affinity_deflation = []

# Plan 423 Phase 3 — Spectral Rewiring GOAT gate bench (G1–G6).
# std::time::Instant + harness=false + self-contained CountingAllocator
# (criterion is not a katgpt-rs dev-dep; matches the repo bench convention).
[[bench]]
name = "bench_423_spectral_rewire_goat"
path = "benches/bench_423_spectral_rewire_goat.rs"
required-features = ["spectral_rewire"]
harness = false

# Plan 455 Phase 2 — Quantile Balancing MoE Router N/M/k sweep benchmark.
# std::time::Instant + harness=false (matches Plan 279 bench convention).
[[bench]]
name = "quantile_balance_router_bench"
path = "benches/quantile_balance_router_bench.rs"
required-features = ["quantile_balance_router"]
harness = false

# Plan 455 Phase 3 — Head-to-head: QB (Plan 455) vs MPI (Plan 279) vs composed.
# Integration test (not a bench) — asserts orthogonality of the two axes and
# prints the decision matrix used for the T3.6 promotion verdict.
[[test]]
name = "bench_455_phase3_head_to_head"
path = "tests/bench_455_phase3_head_to_head.rs"
required-features = ["quantile_balance_router", "manifold_power_iter_router"]

# Plan 475 — ICA Lens FastICA GOAT gate (G1 latency, G2 quality, G4 alloc,
# G5 determinism). The load-bearing gate is G2: FastICA directions must be
# more non-Gaussian than PCA + kurtosis-ranking.
[[bench]]
name = "bench_475_ica_lens_goat"
path = "benches/bench_475_ica_lens_goat.rs"
required-features = ["ica_lens"]
harness = false

# Issue 681 — ks_d_statistic ↔ katgpt-core ks_d_vs_fitted_gaussian agreement
# (bit-identical by construction; pins the port against the original).
[[test]]
name = "gaussianity_agreement"
path = "tests/gaussianity_agreement.rs"
required-features = ["gaussianity_agreement"]

# ── Issue 713 T2: `required-features` on `#![cfg]`-gated GOAT gates ─────────
#
# Every target below opens with a whole-file `#![cfg(feature = ...)]`. Without
# the row, `cargo test --test <name>` compiles it to an EMPTY binary and prints
# `running 0 tests` / `ok. 0 passed` with exit 0 — indistinguishable from a real
# pass, on the gates whose green IS the evidence for a promotion.
#
# The `#![cfg]` protects the COUNT. This protects the READER. Both are needed.
#
# `cargo test --workspace` is UNAFFECTED: cargo silently skips a target whose
# required-features are off, so this cannot red an existing workspace CI. What
# changes is that naming the target without its features now errors (exit 101)
# instead of reporting a green zero.
#
# Measured population + the instrument: `.docs/10_audits/cfg_gated_silent_zero_pass.md` (Issue 713, closed + removed 2026-09-03), scripts/cfg_gated_target_audit.py

[[test]]
name = "bench_455_quantile_balance_goat"
required-features = ["quantile_balance_router"]

# Issue 882 P4 rider (b) — rank-1 spectral deflation GOAT (Bench 897):
# G1b planted common-mode + block recovery, healthy-matrix negative arm
# (gate refuses; ungated deflation hurts), θ grid by direct evaluation, G2
# paired A/B vs the affinity build, G3 λ=0 / refusal bit-identical, G4 0
# allocs. Separate binary so the counting allocator is binary-unique.
[[test]]
name = "bench_897_affinity_deflation_goat"
path = "tests/bench_897_affinity_deflation_goat.rs"
harness = false
required-features = ["affinity_deflation", "river_valley"]
