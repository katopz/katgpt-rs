[package]
name = "katgpt-claim"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Claim-Level Reliability pair — claim_rubric (L1/L2/L3 evidence ladder validator, Plan 307) + clr (sigmoid-projection vote over claim embeddings, Plan 284). Extracted from katgpt-rs root per Proposal 003 Phase 11 (2026-07-04)."
repository = "https://github.com/katopz/katgpt-rs"
keywords = ["claim-reliability", "evidence-ladder", "sigmoid-projection", "verifier", "modelless"]
categories = ["algorithms", "science"]
publish = false  # only katgpt-core ships to crates.io

[dependencies]
# katgpt-core: provides `traits::FeatureClass` (claim_rubric tag) and
# `simd::simd_sum_f32` (clr mgpo + vote). Always-on — both modules need it.
katgpt-core = { path = "../katgpt-core" }

[dev-dependencies]
# blake3: needed only for clr test fixtures (verifier.rs:92, vote.rs:396)
# — the test stubs that compute direction-vector hashes for tamper-evidence
# assertions. Production code does not hash.
blake3 = "1"
# bytemuck: needed for clr test fixtures (verifier.rs:119, vote.rs:423) —
# `h.update(bytemuck::cast_slice(&self.vectors))` for hashing f32 slices.
bytemuck = "1"

[features]
default = ["claim_rubric", "clr"]

# Claim Rubric Runtime — L1/L2/L3 evidence ladder validator (Plan 307).
# DEFAULT-ON (Plan 307 T3.3, 2026-06-23): meta-discipline validator.
claim_rubric = []

# CLR Claim-Level Reliability runtime — sigmoid projection vote over claim
# embeddings (Plan 284, Research 255). DEFAULT-ON.
clr = []

# CLR verdict calibration (riir-ai Issue 964 C1 — the first
# sigmoid_calibration consumer; substrate katgpt-rs Issue 810, GOAT record
# katgpt-rs Bench 807). Wraps any ClaimVerifier with the Platt-style
# SigmoidGateCalibrator: record (sigmoid_output, outcome) pairs where ground
# truth is known, refit off-hot-path, apply in front of the reliability
# gate. Cold start is BIT-IDENTICAL to the uncalibrated verifier (identity
# fast path); the fitted transform is strictly monotone (w = 1/T > 0) so
# pairwise verdict order never inverts. Latent-domain rules: calibration is
# a local monotone transform — calibrated verdicts never cross a sync
# boundary. Opt-in per the no-default-consumer rule until each consumer's
# own GOAT lands.
clr_calibration = ["clr", "katgpt-core/sigmoid_calibration"]

# calibration_staleness (katgpt-rs Issue 841 §B-3 follow-up, seam 3 of 4). The
# Platt (T, b) pair `clr_calibration` fits is fitted against ONE set of
# weights, and this module's own docs already ARGUE that staleness while
# shipping no mechanism for it. Binds a `CalibratedVerifier` to the
# `SnapshotId` it was fitted under; `verify_embedding` — a shipped trait
# method returning a bare `Verdict` — is untouched, and the guarded read is an
# additive sibling. Implies clr_calibration (there is nothing to go stale
# without it).
calibration_staleness = ["clr_calibration", "katgpt-core/diagnostics"]
