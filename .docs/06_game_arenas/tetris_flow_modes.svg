<svg role="img" aria-label="the rulebook's play modes: on a clean low stack it builds a nine-one stack and waits for tetrises; three or more covered holes switch it to downstack, a tall stack to survive, both using safe survival weights; a clean board returns it to build" id="tetris-flow-modes" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 675.688px; background-color: transparent;" viewBox="0 0 675.6875 270" aria-roledescription="flowchart-v2" xmlns:xlink="http://www.w3.org/1999/xlink"><style xmlns="http://www.w3.org/1999/xhtml"></style><style>#tetris-flow-modes{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;fill:#f2e6dd;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#tetris-flow-modes .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#tetris-flow-modes .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#tetris-flow-modes .error-icon{fill:#1d110c;}#tetris-flow-modes .error-text{fill:#e2eef3;stroke:#e2eef3;}#tetris-flow-modes .edge-thickness-normal{stroke-width:1px;}#tetris-flow-modes .edge-thickness-thick{stroke-width:3.5px;}#tetris-flow-modes .edge-pattern-solid{stroke-dasharray:0;}#tetris-flow-modes .edge-thickness-invisible{stroke-width:0;fill:none;}#tetris-flow-modes .edge-pattern-dashed{stroke-dasharray:3;}#tetris-flow-modes .edge-pattern-dotted{stroke-dasharray:2;}#tetris-flow-modes .marker{fill:#b99f8f;stroke:#b99f8f;}#tetris-flow-modes .marker.cross{stroke:#b99f8f;}#tetris-flow-modes svg{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;}#tetris-flow-modes p{margin:0;}#tetris-flow-modes .label{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#f2e6dd;}#tetris-flow-modes .cluster-label text{fill:#e2eef3;}#tetris-flow-modes .cluster-label span{color:#e2eef3;}#tetris-flow-modes .cluster-label span p{background-color:transparent;}#tetris-flow-modes .label text,#tetris-flow-modes span{fill:#f2e6dd;color:#f2e6dd;}#tetris-flow-modes .node rect,#tetris-flow-modes .node circle,#tetris-flow-modes .node ellipse,#tetris-flow-modes .node polygon,#tetris-flow-modes .node path{fill:#241410;stroke:#ff8a4c;stroke-width:1px;}#tetris-flow-modes .rough-node .label text,#tetris-flow-modes .node .label text,#tetris-flow-modes .image-shape .label,#tetris-flow-modes .icon-shape .label{text-anchor:middle;}#tetris-flow-modes .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#tetris-flow-modes .rough-node .label,#tetris-flow-modes .node .label,#tetris-flow-modes .image-shape .label,#tetris-flow-modes .icon-shape .label{text-align:center;}#tetris-flow-modes .node.clickable{cursor:pointer;}#tetris-flow-modes .root .anchor path{fill:#b99f8f!important;stroke-width:0;stroke:#b99f8f;}#tetris-flow-modes .arrowheadPath{fill:rgba(255, 255, 255, 0);}#tetris-flow-modes .edgePath .path{stroke:#b99f8f;stroke-width:1px;}#tetris-flow-modes .flowchart-link{stroke:#b99f8f;fill:none;}#tetris-flow-modes .edgeLabel{background-color:#1d110c;text-align:center;}#tetris-flow-modes .edgeLabel p{background-color:#1d110c;}#tetris-flow-modes .edgeLabel rect{opacity:0.5;background-color:#1d110c;fill:#1d110c;}#tetris-flow-modes .labelBkg{background-color:rgba(29, 17, 12, 0.5);}#tetris-flow-modes .cluster rect{fill:#1d110c;stroke:#3a2117;stroke-width:1px;}#tetris-flow-modes .cluster text{fill:#e2eef3;}#tetris-flow-modes .cluster span{color:#e2eef3;}#tetris-flow-modes div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:#1d110c;border:1px solid hsl(17.6470588235, 1.4634146341%, 0%);border-radius:2px;pointer-events:none;z-index:100;}#tetris-flow-modes .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#f2e6dd;}#t