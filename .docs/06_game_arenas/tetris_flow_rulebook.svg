<svg role="img" aria-label="KatGPT rulebook search: try every spot for the falling piece, every spot for the preview piece keeping the best six, then every piece still left in the bag; score each end board with the strategy rulebook, average over the unknown piece, take the best plan, and play its first move, in about six to nine milliseconds" id="tetris-flow-rulebook" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 910.688px; background-color: transparent;" viewBox="0 0 910.6875 410" aria-roledescription="flowchart-v2" xmlns:xlink="http://www.w3.org/1999/xlink"><style xmlns="http://www.w3.org/1999/xhtml"></style><style>#tetris-flow-rulebook{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;fill:#f2e6dd;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#tetris-flow-rulebook .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#tetris-flow-rulebook .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#tetris-flow-rulebook .error-icon{fill:#1d110c;}#tetris-flow-rulebook .error-text{fill:#e2eef3;stroke:#e2eef3;}#tetris-flow-rulebook .edge-thickness-normal{stroke-width:1px;}#tetris-flow-rulebook .edge-thickness-thick{stroke-width:3.5px;}#tetris-flow-rulebook .edge-pattern-solid{stroke-dasharray:0;}#tetris-flow-rulebook .edge-thickness-invisible{stroke-width:0;fill:none;}#tetris-flow-rulebook .edge-pattern-dashed{stroke-dasharray:3;}#tetris-flow-rulebook .edge-pattern-dotted{stroke-dasharray:2;}#tetris-flow-rulebook .marker{fill:#b99f8f;stroke:#b99f8f;}#tetris-flow-rulebook .marker.cross{stroke:#b99f8f;}#tetris-flow-rulebook svg{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;}#tetris-flow-rulebook p{margin:0;}#tetris-flow-rulebook .label{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#f2e6dd;}#tetris-flow-rulebook .cluster-label text{fill:#e2eef3;}#tetris-flow-rulebook .cluster-label span{color:#e2eef3;}#tetris-flow-rulebook .cluster-label span p{background-color:transparent;}#tetris-flow-rulebook .label text,#tetris-flow-rulebook span{fill:#f2e6dd;color:#f2e6dd;}#tetris-flow-rulebook .node rect,#tetris-flow-rulebook .node circle,#tetris-flow-rulebook .node ellipse,#tetris-flow-rulebook .node polygon,#tetris-flow-rulebook .node path{fill:#241410;stroke:#ff8a4c;stroke-width:1px;}#tetris-flow-rulebook .rough-node .label text,#tetris-flow-rulebook .node .label text,#tetris-flow-rulebook .image-shape .label,#tetris-flow-rulebook .icon-shape .label{text-anchor:middle;}#tetris-flow-rulebook .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#tetris-flow-rulebook .rough-node .label,#tetris-flow-rulebook .node .label,#tetris-flow-rulebook .image-shape .label,#tetris-flow-rulebook .icon-shape .label{text-align:center;}#tetris-flow-rulebook .node.clickable{cursor:pointer;}#tetris-flow-rulebook .root .anchor path{fill:#b99f8f!important;stroke-width:0;stroke:#b99f8f;}#tetris-flow-rulebook .arrowheadPath{fill:rgba(255, 255, 255, 0);}#tetris-flow-rulebook .edgePath .path{stroke:#b99f8f;stroke-width:1px;}#tetris-flow-rulebook .flowchart-link{stroke:#b99f8f;fill:none;}#tetris-flow-rulebook .edgeLabel{background-color:#1d110c;text-align:center;}#tetris-flow-rulebook .edgeLabel p{background-color:#1d110c;}#tetris-flow-rulebook .edgeLabel rect{opacity:0.5;background-color:#1d110c;fill:#1d110c;}#tetris-flow-rulebook .labelBkg{background-color:rgba(29, 17, 12, 0.5);}#tetris-flow-rulebook .cluster rect{fill:#1d110c;stroke:#3a2117;stroke-width:1px;}#tetris-flow-rulebook .cluster text{fill:#e2eef3;}#tetris-flow-rulebook .cluster span{color:#e2eef3;}#tetris-flow-rulebook div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size