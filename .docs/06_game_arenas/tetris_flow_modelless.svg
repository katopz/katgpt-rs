<svg role="img" aria-label="Reflex · modelless lane: the same spot sentence is decoded back into board features, scored by a small linear head fitted on laya's recorded answers, and the highest score is played, in microseconds inside WebAssembly" id="tetris-flow-modelless" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 990.062px; background-color: transparent;" viewBox="0 0 990.0625 270" aria-roledescription="flowchart-v2" xmlns:xlink="http://www.w3.org/1999/xlink"><style xmlns="http://www.w3.org/1999/xhtml"></style><style>#tetris-flow-modelless{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;fill:#f2e6dd;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#tetris-flow-modelless .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#tetris-flow-modelless .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#tetris-flow-modelless .error-icon{fill:#1d110c;}#tetris-flow-modelless .error-text{fill:#e2eef3;stroke:#e2eef3;}#tetris-flow-modelless .edge-thickness-normal{stroke-width:1px;}#tetris-flow-modelless .edge-thickness-thick{stroke-width:3.5px;}#tetris-flow-modelless .edge-pattern-solid{stroke-dasharray:0;}#tetris-flow-modelless .edge-thickness-invisible{stroke-width:0;fill:none;}#tetris-flow-modelless .edge-pattern-dashed{stroke-dasharray:3;}#tetris-flow-modelless .edge-pattern-dotted{stroke-dasharray:2;}#tetris-flow-modelless .marker{fill:#b99f8f;stroke:#b99f8f;}#tetris-flow-modelless .marker.cross{stroke:#b99f8f;}#tetris-flow-modelless svg{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;}#tetris-flow-modelless p{margin:0;}#tetris-flow-modelless .label{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#f2e6dd;}#tetris-flow-modelless .cluster-lab