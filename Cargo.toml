similarity_inference = ["katgpt-core/similarity_inference"]  # Similarity Inference (Plan 526) — forwarding shim for example/bench access. See katgpt-core/similarity_inference for the canonical comment. OPT-IN upstream (DEMOTED 2026-09-04 per riir-ai Issue 867 T1.3 — was DEFAULT-ON 2026-08-11..09-03 with zero consumers workspace-wide; Plan 526 Phase 6 promotion record): Phases 1-5 GOAT ALL PASS (Bench 579) — G1 closed-form, G2 emergent coop 100% vs 0%, G3 no-regression, G4 alloc-free, G5 indirect inference (Super-GOAT subset), G6 crowd-scale 24ns/update, G7 UQ floor 119x better, G8 PD threshold 0.5.

