# ─────────────────────────────────────────────────────────────────────────────
# Workspace release/bench codegen settings — REQUIRED after the multi-crate
# refactor (Plan 005 katgpt-pruners → Issue 003 katgpt-speculative → Proposal 003
# katgpt-quant/katgpt-attn → Issue 007 katgpt-forward → Issue 013/014/015 extractions,
# now 20 in-tree crates).
#
# Without LTO, cross-crate calls (e.g. root benchmark → `crate::speculative::*`
# re-export → `katgpt-speculative::*`, or `crate::pruners::bandit::*` →
# `katgpt-pruners::*`) cannot be inlined, even when the callee carries
# `#[inline(always)]`. The Cargo defaults (`lto = false`, `codegen-units = 16`)
# silently broke the hot-path inlining assumptions documented in
# `.docs/04_performance.md`, regressing 26/26 perf benchmarks 15–65% (peak
# AbsorbCompress compress() −65.2%, Bandit update() −42.5%, MTP OFF (BPE)
# −56.5%) in the 2026-07-03 audit.
#
# `lto = "fat"` + `codegen-units = 1` restores cross-crate inlining and
# constant propagation across the 20-crate graph. The benches run via
# `cargo run --release` (main.rs → benchmark::run_all), so the release profile
# is the one that matters; `[profile.bench]` is included for `cargo bench`.
#
# Trade-off: link time increases (~2–4×), but the katgpt-rs binary is a
# benchmark/research runner, not a hot-reload dev loop — the trade is correct.
# Dev iteration uses `cargo check` (no link), which is unaffected.
# ─────────────────────────────────────────────────────────────────────────────
[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1

# ─────────────────────────────────────────────────────────────────────────────
# Build profiles — dev debuginfo budget (riir-ai .issues/723 Phase 1)
# ─────────────────────────────────────────────────────────────────────────────
# macOS defaults to `split-debuginfo = "unpacked"`, so DWARF lands in the
# per-CGU `.o` files under target/debug/deps — measured at 23.39 GB across
# 143,294 files in riir-ai alone. Two dev-only levers, measured on a clean
# `cargo build -p katgpt-core --lib` (57 packages):
#
#   stock                                   376.4 MB total / 80.6 MB .o / 16s
#   dev.debug = "line-tables-only"          333.4 MB / 51.8 MB / 11s
#   dev.package."*".debug = false           363.5 MB / 73.5 MB / 14s
#   both (adopted here)                     324.9 MB / 47.1 MB / 10s
#                                           => -13.7% total, -41.6% .o bytes
#
# Counterintuitive result, reproduced twice: setting package."*".debug to
# "line-tables-only" instead of `false` measures WORSE than either lever alone
# (366.1 MB / 75.8 MB). Re-measure before "improving" it that way.
#
# `release` and `bench` already default to debug = false (verified: the release
# binary has an empty .debug_info), so they need no entry here.
#
# Tradeoff: dependencies — including sibling path deps such as katgpt-core when
# built from riir-ai — carry no debuginfo, so backtraces through them lose
# file:line. Delete the package."*" block for a debugger session that needs it.
# `line-tables-only` keeps file:line for first-party code but drops locals.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# ── Issue 713 T2: `required-features` on `#![cfg]`-gated GOAT gates ─────────
#
# Every target below opens with a whole-file `#![cfg(feature = ...)]`. Without
# the row, `cargo test --test <name>` compiles it to an EMPTY binary and prints
# `running 0 tests` / `ok. 0 passed` with exit 0 — indistinguishable from a real
# pass, on the gates whose green IS the evidence for a promotion.
#
# The `#![cfg]` protects the COUNT. This protects the READER. Both are needed.
#
# `cargo test --workspace` is UNAFFECTED: cargo silently skips a target whose
# required-features are off, so this cannot red an existing workspace CI. What
# changes is that naming the target without its features now errors (exit 101)
# instead of reporting a green zero.
#
# Measured population + the instrument: `.docs/10_audits/cfg_gated_silent_zero_pass.md` (Issue 713, closed + removed 2026-09-03), scripts/cfg_gated_target_audit.py

