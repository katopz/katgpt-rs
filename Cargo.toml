pathway_tracker = []  # Intrinsic pathway stability detection (Research 205, Plan 231, GOAT 7/7, default-ON)
cs_kv_probe = ["katgpt-kv/cs_kv_probe"]  # CS-KV-Importance Probe + Density-Budget Interpolator (Plan 280, Research 247) — opt-in — Plan 280 GOAT G1/G2/G3 ALL PASS (.plans/280_*.md status '✅ Complete' — G1 cs-ranking beats random by ≥15pp on synthetic {3,17,42}-of-64 task, G2 sparse-vs-dense duality shape matches paper Fig 5, G3 zero-overhead + no allocations); headline task-gain proof (G6) + NPC wiring live in riir-ai Plan 311 — this plan ships only the open math, so stays opt-in as a probe (not a default routing primitive).
ict_branching = ["katgpt-core/ict_branching"]  # ICT Distributional Branching-Point Detector — collision_purity β(π) + Rényi H₂ + JS-divergence-to-group-mean + BranchingDetector (Plan 294, Research 270, arxiv 2606.19771, Super-GOAT). Opt-in — Plan 324 T9.4 GOAT G7+G8+G9 ALL PASS (2026-06-20+; G7 zero ICT data in SyncBlock across 1000 ticks, G8 ICT-gated CLR 89.72% quality at 9.40% cost, G9 ICT-gated HLA recall = 100% of baseline); stays opt-in pending in-game integration test at 1000-NPC scale (k_select floor finding: per-NPC cognitive savings smaller than paper's ~10% headline; crowd-scale savings come from Phase 4 rotating sampler).
induced_cwm = ["katgpt-core/induced_cwm"]  # Induced Code World Model kernel primitive — `InducedCwmKernel: GameState` marker + `CwmCommitment` (BLAKE3) + `BeliefInferenceFn<S>` + `TransitionUnitTest` (Plan 296, Research 275, arxiv 2510.04542). Open half of the CWM Super-GOAT; LLM-induction pipeline is private (riir-ai Plan 326). Opt-in — Plan 296 G1-G4 ALL PASS (.benchmarks/296_induced_cwm_primitive_goat.md, 2026-06-21 — 47/47 tests, all 4 gates green: G1 commitment, G2 ISMCTS non-fold ≥70%, G3 tournament picks stronger heuristic, G4 BLAKE3 commitment roundtrip); stays opt-in by design per Plan 296 T5.4 verdict — primitive, not default-on capability; ready for downstream consumption (riir-ai Plan 326).
induced_cwm_ismcts = ["katgpt-core/induced_cwm_ismcts"]  # Information-Set MCTS over an induced CWM + belief fn (Plan 296 Phase 2). Self-contained search tree (does NOT reuse root-crate `mcts_search` — that lives in katgpt-rs/src, katgpt-core cannot depend on the root).
induced_cwm_tournament = ["katgpt-core/induced_cwm_tournament"]  # Value Function Tournament (Plan 296 Phase 3). Round-robin arena-play selector over `StateHeuristic` candidates.
bisimulation_operator_inference = ["katgpt-core/bisimulation_operator_inference"]  # Bisimulation Operator Inference — generic modelless primitive that quotients an observed transition graph into bisimulation-equivalent state classes and infers an abstract PDDL-like operator schema (Plan 324, Research 308, arXiv:2602.19260 "The Price Is Not Right" Duggan et al. Feb 2026; underlying NSM method arXiv:2508.21501 Lorang et al.). Closes Research 264 §2.2 gap #1 (PTG data structure) + #2 (motif-mining loop). Lighter-weight PDDL-side counterpart to Induced CWM (Plan 296) — deterministic Paige-Tarjan partition refinement vs CWM's LLM-based code induction. Opt-in by design; GOAT G1–G5 all PASS (Bench 324).
sleep_time_anticipation = ["katgpt-core/sleep_time_anticipation"]  # Sleep-Time Query Anticipator — open primitive for offline query anticipation (Plan 334, Research 318, arXiv:2504.13171 Lin et al. Letta/Berkeley). SleepTimeAnticipator orchestrates per-direction sleep-time compute → emits reusable AnticipatedQuerySet (c' artifact, BLAKE3-committed) → wake-time consume() does cheap dot-product + sigmoid-gated lookup, falling through to fresh compute on low-predictability queries. PredictabilityScorer trait + DotPredictabilityScorer default (p = sigmoid(α·dot(c,dir)+β)); AmortizationCostModel operationalizes the paper's §5.3 cost model. Phase 1 ships traits + types + IdentityFunctorOp (synthetic-test default, z_i = c + dir_i). Game-specific direction-vector catalogs, NPC tiering, HLA wiring, chain commitment live in riir-ai Plan 341 (private). Opt-in — Plan 334 Phase 1+2 synthetic gates G1/G2/G5/G6/G7 ALL PASS (.benchmarks/334_sleep_time_goat.md, 2026-06-27 — G1 mechanics, G2 cost model, G5 0 allocs/call, G6 consume() 9.5ns at D=8 / 57.6ns at D=64, G7 BLAKE3 tamper detection); riir-ai Plan 341 Phase 7 GOAT G1-G4 PASS on real predictability-labeled corpus — promoted to DEFAULT-ON in riir-engine npc_sleep_time (T7.3 + Issue 005). This root forwarder stays opt-in as layer split (production runtime is riir-engine-side). Sigmoid, not softmax (per AGENTS.md).
paired_loss_diagnostic = ["katgpt-core/paired_loss_diagnostic"]  # Paired Token-Level Loss Gap Diagnostic — generic modelless A/B measurement primitive (Plan 335, Research 319, arXiv:2606.20936 Li & Merrill AI2). PairedLossGap computes per-token Δ_i = ℓ_A − ℓ_B from two log-prob traces; tag-stratified means (Content/Function/Other/BracketOpen/BracketClose/CopyN); filtered aggregates (ALL_TOKENS / TOP-K∩NO-COPY / COPY-N-ONLY) that amplify small architecture gaps aggregate loss hides (paper §6 ~2× separation on Olmo 1B). ClassSizeBound exposes Proposition 1 (DKL ≤ log|V_τ|) — the volume-of-support bound justifying raw-vs-latent sync. Pure measurement tool, NOT an inference mechanism (not Super-GOAT). Generic math, no game/chain/shard semantics. Opt-in — Plan 335 GOAT G1/G2/G2-alloc/G3/G4 ALL PASS (.benchmarks/335_paired_loss_goat.md, 2026-06-27 — G2 from_log_probs 0.875µs + filtered_mean 1.500µs <2µs each, G2-alloc 0 allocs on scratch-reused SIMD path, G4 TopKNoCopy amplifies |gap| 13.9× vs AllTokens on characterized-bias fixture, target ≥1.5×); stays opt-in because measurement tools are opt-in by nature (audit-cadence, not every-tick). Passthrough to katgpt-core.
transformer_inversion = ["katgpt-core/transformer_inversion"]  # SipIt Transformer Inversion (Plan 561) — forwarding shim for example/bench access. See katgpt-core/transformer_inversion for the canonical comment. Opt-in (Gain tier, parked pending consumer per Plan 561 §Phase 5).
