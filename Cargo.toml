[workspace]
members = ["crates/katgpt-attn", "crates/katgpt-attn-match", "crates/katgpt-backend", "crates/katgpt-band", "crates/katgpt-canon", "crates/katgpt-claim", "crates/katgpt-core", "crates/katgpt-dec", "crates/katgpt-deprecated", "crates/katgpt-device-verify", "crates/katgpt-forward", "crates/katgpt-hla", "crates/katgpt-kv", "crates/katgpt-micro-belief", "crates/katgpt-moka-wasm", "crates/katgpt-nn", "crates/katgpt-percepta", "crates/katgpt-personality", "crates/katgpt-proof-cert", "crates/katgpt-pruners", "crates/katgpt-quant", "crates/katgpt-ruliology", "crates/katgpt-sense", "crates/katgpt-sleep", "crates/katgpt-sparse", "crates/katgpt-spectral", "crates/katgpt-speculative", "crates/katgpt-tokenizer", "crates/katgpt-transformer", "crates/katgpt-types", "crates/katgpt-validator", "."]
resolver = "3"

[package]
name = "katgpt-rs"
version = "0.2.1"
edition = "2024"
publish = false  # dev/examples aggregator — never published. The katgpt-core crate family ships to crates.io.

[dependencies]
katgpt-core = { path = "crates/katgpt-core" }
katgpt-transformer = { path = "crates/katgpt-transformer" }
# katgpt-validator (Proposal 003 Phase 11, 2026-07-04): extracted two-tier syntax
# pruner (PartialParser + SynPruner). Non-optional path dep; the historical
# root `validator` feature is now a back-compat re-export gate. The root
# re-exports the leaf's surface as `pub use katgpt_validator as validator;`
# so `katgpt_rs::validator::*` paths continue to resolve.
katgpt-validator = { path = "crates/katgpt-validator" }
# katgpt-forward (Issue 007 Phase F, 2026-07-02): the top-tier crate hosting
# `ForwardContext` — the composition-layer join point that sits ABOVE both
# katgpt-transformer (buffer types + WallPrefixState) and katgpt-pruners
# (CnaModulator/SubstrateMask/HydraSkipPlan). Neither leaf could host it
# without a cycle. Root re-exports `ForwardContext` from `crate::transformer`
# so every historical call site resolves unchanged. Non-optional — the 33
# root forward-pass functions access ctx.<field> directly.
katgpt-forward = { path = "crates/katgpt-forward", default-features = false }
# katgpt-backend (Issue 413, 2026-07-08): device inference backends — the
# `InferenceBackend` trait + `CpuBackend` + `AneBackend` (CoreML) + `GpuBackend`
# (Metal). Non-optional — root re-exports the leaf as `inference_backend` so
# all historical `katgpt_rs::inference_backend::*` paths resolve. The macOS-only
# device deps (metal/coreml-*/prost) live in the leaf; root's `ane` /
# `gpu_inference` features forward to the leaf's features.
katgpt-backend = { path = "crates/katgpt-backend" }
# katgpt-deprecated (Proposal 003 Phase 3a, 2026-07-01): the loser crate.
# Exiled primitives (dead stubs, GOAT-failed, off-topic). Never default-on.
katgpt-deprecated = { path = "crates/katgpt-deprecated" }
# katgpt-pruners (Plan 005, 2026-06-29): extracted from src/pruners/ (minus bomber).
# Non-optional — root re-exports the pruners surface from `crate::pruners::*` via
# the back-compat shim in src/pruners/mod.rs (`pub use katgpt_pruners::*`).
# Default features mirror the historical root default-on pruner surface.
katgpt-pruners = { path = "crates/katgpt-pruners", default-features = false }
# katgpt-speculative (Issue 013): shared DDTree + speculative decoding substrate.
# Currently consumed via the re-export at `katgpt_speculative::dd_tree::*` from
# downstream riir-engine. The root `src/speculative/dd_tree.rs` core functions
# have drifted (see TODO in that file) and are NOT yet re-exported from here —
# the divergence is tracked for a follow-up convergence pass.
katgpt-speculative = { path = "crates/katgpt-speculative" }
# katgpt-attn-match (Issue 359): extracted Attention Matching KV compaction substrate.
# Non-optional — `attn_match` is DEFAULT-ON (Plan 271 GOAT 9/9) and the root re-exports
# the leaf as `pub use katgpt_attn_match as attn_match;`. The `adaptive_cot` glue
# (composes root-only `freq_bandit`) stays in root at `src/attn_match_adaptive_cot.rs`.
katgpt-attn-match = { path = "crates/katgpt-attn-match" }
# katgpt-band (Proposal 003 Phase 11, 2026-07-04): extracted Band-Conditioned KV
# Segment Selector cluster (Plan 265, arXiv:2605.12733) — band_conditioner,
# bckvss, collider_pruner, adaptive_cot_stopper. Non-optional path dep; each
# module is opt-in via its feature flag (band_conditioner + collider_consistency
# are default-ON mirroring root default). The root re-exports each module behind
# its historical feature so `katgpt_rs::band_conditioner::*` /
# `katgpt_rs::collider_pruner::*` / etc. continue to resolve.
katgpt-band = { path = "crates/katgpt-band" }
# katgpt-claim (Proposal 003 Phase 11, 2026-07-04): extracted Claim-Level
# Reliability pair (claim_rubric + clr, Plan 307 + Plan 284). Non-optional
# path dep; both modules are default-ON. Root re-exports each module so
# `katgpt_rs::claim_rubric::*` / `katgpt_rs::clr::*` paths continue to resolve.
katgpt-claim = { path = "crates/katgpt-claim" }
# katgpt-quant (Proposal 003 Phase 1, 2026-07-01): extracted quantization codecs
# (turboquant, planar_quant, iso_quant, octopus, hybrid_oct_pq). Non-optional path dep;
# each codec is opt-in via its feature flag. The root re-exports each module behind its
# historical feature so `katgpt_rs::turboquant::*` / `katgpt_rs::octopus::*` / etc.
# continue to resolve.
katgpt-quant = { path = "crates/katgpt-quant" }
# katgpt-ruliology (Proposal 003 Phase 11, 2026-07-04): extracted Wolfram
# ruliology (Plan 188, Research 168) — exhaustive simple-program enumeration
# (FSM/CA/TM) as bandit arms. Non-optional path dep; the historical root
# `ruliology` feature gates the `delta_gated_co_evolve` path which consumes
# `katgpt_pruners::g_zero::delta_absorb::DeltaGatedConfig`. Root re-exports
# the module so `katgpt_rs::ruliology::*` paths continue to resolve.
katgpt-ruliology = { path = "crates/katgpt-ruliology" }
# katgpt-attn (Proposal 003 Phase 2, 2026-07-01): extracted attention stack
# primitives (gdn2 kernel+types, dash_attn clean core, chiaroscuro, rat_bridge,
# ega_attn, diagonal_gate, static_cal, funcattn_compose). Non-optional path dep;
# each module is opt-in via its feature flag. The root re-exports each module
# behind its historical feature so `katgpt_rs::gdn2::*` / `katgpt_rs::chiaroscuro::*`
# / etc. continue to resolve. Forward glue + VortexFlow cluster stay in root.
katgpt-attn = { path = "crates/katgpt-attn" }
plotters = { version = "0.3", optional = true }  # Issue 355 Phase 2a: optional — gated behind `plot` feature. Only `src/plot.rs` + `src/main.rs` benchmark runner use it. Default-on (in `default` array) to preserve historical behavior; riir-ai consumers set `default-features = false` to drop it.
rayon = "1.10"
log = "0.4"
blake3 = "1"
# NOTE: no `uuid` dep here on purpose. It was declared for "Issue 001 HLA
# eigenbasis" provenance ids, but that code lives in `katgpt-spectral`, which
# carries its own `uuid` dep — this crate never referenced it (only a doc
# comment in benches/hla_eigenbasis_bench.rs mentions `Uuid::now_v7`).
# Beyond being dead weight, `uuid`'s `v7` feature hard-fails the
# wasm32-unknown-unknown build ("specify a source of randomness using one of
# the `js`, `rng-getrandom`, or `rng-rand` features"), which broke
# riir-mmorpg-examples' wasm modules downstream. If something here ever needs
# UUIDs, target-gate the `v7` feature to non-wasm32 like riir-engine /
# riir-games-shared / riir-games-civ do.
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
bevy_ecs = { version = "0.15", optional = true }  # Standalone ECS (Plan 033)
wasmi = { version = "2", optional = true, features = ["simd"] }  # WASM bomber validator (Plan 034, wasmi migration Plan 167). `simd`: hosts load +simd128-built modules
papaya = { version = "0.2", optional = true }      # Lock-free concurrent HashMap (Plan 037)
# katgpt-tokenizer (Issue 014): extracted to standalone crate. Non-optional — the
# BPE substrate is always compiled, matching pre-extraction `pub mod tokenizer`
# being unconditional. `good_lp` moved into katgpt-tokenizer (gated by convex_tok).
katgpt-tokenizer = { path = "crates/katgpt-tokenizer" }
# katgpt-percepta (Plan 064): extracted to standalone crate. Non-optional — legacy module
# (KVCache2D, Sudoku9x9, StreamingSolver) is zero-dep and always compiled, matching the
# pre-extraction behavior where `pub mod percepta` was unconditional. Feature ladder gates
# only the advanced parts (CHT, gates, graph, wasm, compile).
katgpt-percepta = { path = "crates/katgpt-percepta" }
# katgpt-spectral (Issue 015 Phase 2): extracted spectral quantization substrate.
# Non-optional — `spectralquant` is `default = ["spectral_quant"]`-historically-on
# and has non-KV consumers (funcattn_compose, chiaroscuro, benchmark). The root
# crate re-exports it as `katgpt_rs::spectralquant` for back-compat.
katgpt-spectral = { path = "crates/katgpt-spectral" }
# katgpt-sparse (Proposal 003 Phase 11, 2026-07-04): extracted sparse task-vector
# family (SOPTV storage + SPLAT specialist projection, Plan 264/265). Non-optional
# path dep; each module is opt-in via its feature flag (both default-ON).
# `specialist_projection` consumes `katgpt-band::band_conditioner::ComputeTarget`
# (cross-crate edge — clean direction: sparse depends on band). Root re-exports
# each module so `katgpt_rs::sparse_task_vector::*` /
# `katgpt_rs::specialist_projection::*` paths continue to resolve.
katgpt-sparse = { path = "crates/katgpt-sparse" }
# katgpt-proof-cert (Proposal 003 Phase 12, 2026-07-04): extracted hierarchical GOAT
# proof certificates (Plan 145, Research 106). Optional path dep (gated by the
# `proof_cert` feature); the `wasm_proof_witness` feature additionally enables
# the blake3-bearing subset. Root re-exports as `katgpt_rs::proof_cert::*` for
# back-compat (macro `$crate::proof_cert::*` paths preserved via the re-export shim).
katgpt-proof-cert = { path = "crates/katgpt-proof-cert", optional = true }
# katgpt-kv (Issue 015 Phase 3): extracted KV-cache namespace. Non-optional — the
# root re-exports each sub-module behind its historical feature flag
# (`kv_share`, `osc_kv`, `cs_kv_probe`, `shard_kv`, `sp_kv`, `still_kv`, `kvarn`,
# `targeted_precision`). All flags remain default-off-or-on as before.
katgpt-kv = { path = "crates/katgpt-kv" }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true } # AutoGo REST API client (Plan 065)
toml = "0.8"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }  # extern_crate_alloc: enables pod_collect_to_vec (used by transformer.rs weight loading). On native this is unified transitively via plotters→image, but wasm32 builds skip plotters so the feature must be explicit. See Plan 316.
half = "2"  # f16 compact KV cache storage (Plan 245 StillKV)
rustfft = { version = "6", optional = true }  # CHIAR per-token DCT entropy (Plan 269)
# Kimi-K3 loader deps (Proposal 032 Phase 5, gated by `kimi_k3_loader`).
safetensors = { version = "0.4", optional = true }  # model.safetensors weight loader
base64 = { version = "0.22", optional = true }  # tiktoken.model binary format (base64-encoded token→rank pairs)
# GPT-4/Kimi-K3 pretokenizer regex (Issue 411). Uses fancy-regex for the
# negative lookahead `(?!�?)` + `(?!�)` in the GPT-4 regex pattern.
fancy-regex = { version = "0.14", optional = true }
# mmap loader for zero-copy weight access (Phase 7 — eliminates the 1.5 GB
# `read_to_end` buffer copy). Native only: memmap2 needs a real OS file.
# wasm32 falls back to the in-memory path.
memmap2 = { version = "0.9", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom wasm32 backends — required so that transitive consumers (bevy_ecs
# → bevy_utils → ahash pulls BOTH getrandom 0.2 and 0.3) compile for the
# browser / CF Worker / wasmtime wasm32-unknown-unknown targets. Without
# these, `secure_vessel` / `bomber-wasm` / `bomber` fail with getrandom's
# "wasm32-unknown-unknown targets are not supported by default" error.
# getrandom 0.3 renamed the feature: `js` (0.2) → `wasm_js` (0.3).
# See https://docs.rs/getrandom/#webassembly-support
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

# (Issue 413, 2026-07-08): coreml-native / coreml-proto / prost / metal moved
# into crates/katgpt-backend/Cargo.toml's macOS target-deps section. The
# historical `ane` / `gpu_inference` features now forward to katgpt-backend's
# own `ane` / `gpu_inference` features, which gate the optional device deps
# inside the leaf.

[dev-dependencies]
ratatui = "0.29"
crossterm = "0.28"
tempfile = "3"

[features]
default = ["orthogonal_procrustes", "domain_latent", "bandit_top_p", "spectral_quant", "hybrid_oct_pq", "deep_manifold", "federation", "tes_loop", "lattice_deduction", "delta_routing", "stability_metrics", "mls_aggregate", "gdn2_attention", "dreamer", "lt2_looped", "dmax_spd", "eqr_convergence", "subterranean", "sr2am_configurator", "data_gate", "plasma_path", "tf_loop", "dual_leo", "sigmoid_margin", "moa_inference", "sleep_consolidation", "dual_gram_pca", "roofline_cost", "newton_schulz", "river_valley", "peira_distill", "kog_cpu_fusion", "gepa_reflective", "phrase_boost", "hydra_budget", "budget_adaptation", "ilc_distill", "trd_refined_draft", "swir_switch_thinking", "freq_bandit", "spec_reconciliation", "trust_region_spec", "curvature_alloc", "directional_credit", "kv_share", "nds_proxy", "wealth_pruner", "speculative_generator", "kurtosis_gate", "kvarn", "chain_fold", "vortex_flow", "domino_correction", "corr_budget", "best_buddies", "rosetta_pruner", "rv_gated_routing", "problem_mutator", "idea_divergence", "self_distilling_bandit", "lodestar", "bfcf_lsh_cms", "belief_drafter", "substrate_gate", "llmexec_guard", "outlier_guard", "segment_checkpoint", "regime_transition", "static_cal_tables", "targeted_precision", "modality_pruned_load", "precision_aware_draft", "async_qdq_overlap", "channel_simd_align", "schema_centroid", "reward_mem", "collapse_aware_thinking", "auto_constraint_synthesis", "union_bound_confidence", "pathway_tracker", "federation_composer", "caddtree_budget", "concept_grounding", "reward_calibrator", "decision_explain", "posterior_evolution", "mux_latent_context", "sense_lod", "spectral_pruner", "epiplexity_bandit", "breakeven_routing", "lattice_operad", "spec_pruner", "ssd_block", "ss_pruner", "dendritic_gate", "sparse_task_vector", "off_principal_retrieval", "spectral_rank", "module_energy_route", "gauge_invariant", "chiaroscuro", "attn_match", "triggered_injection", "temporal_deriv", "manifold_power_iter_router", "quantile_balance_router", "self_advantage_gate", "clr", "personality_composition", "committed_field_blend", "cce_moderator", "claim_rubric", "salience_tri_gate", "complexity_prior_sampler", "depth_invariance", "cross_resolution_transport", "latent_field_steering", "viable_manifold_graph", "subspace_phase_gate", "closed_unit_compaction", "fourier_continuation", "funcattn", "closure_instrument", "non_interference_branches", "sigmoid_graded_reject", "zone_density_routing", "band_conditioner", "specialist_projection", "collider_consistency", "future_probe", "step_attribution_qualifier", "smooth_min_similarity", "ica_lens", "plot"]  # funcattn DEFAULT-ON (2026-07-07, post-Issue-049 D4 fix): G6 LLM-domain gate now PASS - generate_pattern_dataset rejects degenerate a==b sequences (was admitting ~12.5% constant draws at V=8, corrupting the learned basis and producing a spurious 0.969 plateau vs SDPA 1.000). Post-fix: FUNCATTN=1.000 SDPA=1.000 @ release 600 FD-SGD steps; debug 40-step FUNCATTN 0.9297 > SDPA 0.6719. 6/6 GOAT gates green (G1-G5 + G6). Modelless closed-form Tikhonov operator (no training). Heavy downstream use: riir-ai plans 318/329/330/309/310/321 consume C as transport substrate. Prior G6 FAIL was a test-data-gen artifact, NOT a primitive ceiling.  # step_attribution_qualifier DEFAULT-ON (Plan 381 Phase 5, 2026-07-06): G1 14/14 tests, G3 cfg-gated no-regression, G4 13ns gate overhead @ W=64 (76.9× under 1µs), G5 zero deps, G6 feature-isolation clean. G2 (quality-parity) verified via riir-ai Plan 313 Phase 5 G6 PoC — 81.6% drift reduction vs no-attribution baseline (DirectionDelta mutations), 63.1% vs TrajectoryDoctor-only. Modelless instantiation of SkillAdaptor (arXiv:2606.01311) eq. 8 Δ≥0 commit gate. Sibling to TrajectoryDoctor (Plan 223).  # zone_density_routing DEFAULT-ON (Plan 351 Phase 3): G5a +19.4% entropy gain, G5b 99.1% compute saved, G5c 0 stale reads. Modelless.  # sigmoid_graded_reject DEFAULT-ON (Plan 310 T4.1, 2026-06-26): T1 GOAT both halves PASS (T3.2 perf + T3.1 quality), HarnessBridge Table 7 tolerant>strict confirmed. Zero runtime cost unless caller invokes soft_reject_with_relax.  # non_interference_branches DEFAULT-ON (Plan 329 Phase 3, 2026-06-26): G1 8 orthogonal directions in D=8 (pairwise interference 0.00e0<1e-6), G2 route 301.5ns<1us (64-branch bank), G3 all clean, G4 0 allocs/100 calls, G5 [] deps. 101/101 tests.  # closure_instrument DEFAULT-ON (Plan 290 T4.7 + G4 fix, 2026-06-26): G1 67us<100us (bit matrix, Issue 035), G2 638us<5ms, G3 synthetic-proxy monotone, G4 0.296MB<1MB (Option<[u8;32]> fix — production via PtgTracedPruner::trace passes None for all nodes; upper bound all-Some = 1.822MB informational). 55/55 tests green (38 closure + 3 mining + 8 wire + 6 integration). Zero runtime cost unless a caller invokes the recorder. API break: PtgNode.blake3_in [u8;32] -> Option<[u8;32]>; PtgRecorder::enter takes Option.  # closed_unit_compaction DEFAULT-ON (Plan 333 Phase 6, 2026-06-25): 7/7 GOAT gates PASS - G1 recall=1.000/FDR=0.000, G2 50% suppression, G3 probe 1.4ns ratio=1.00, G4 zero-alloc, G5 feature isolation, G6 0 softmax, G7 can_freeze isomorphism all 4 combos. evaluate() 8.91ns <50ns, 112.9M/s >=50M. Super-GOAT: trajectory compaction and shard freeze are the same primitive (proven structurally). Zero runtime cost unless a caller invokes evaluate.  # viable_manifold_graph DEFAULT-ON (Plan 312 Phase 5, 2026-06-24): G1-G7 correctness PASS + perf bench PASS post-CSR (manifold_random_walk 485.58→7.10 ns/step, 14× under 100ns target; CSR makes for_each_neighbor O(degree); random-walk output byte-identical).  # latent_field_steering DEFAULT-ON (Plan 309 Phase 4, 2026-06-23): G1-G5 all PASS - G1 fear-axis 1.50x>=1.30, G2 mean cos 0.9958>=0.95 min cos 0.9667>=0.90, G3 leakage 4.5e-5<0.01, G4 19.2us<1ms, G5 0 allocs. Caveat: 8% argmax flip at alpha=0.3 - keep alpha<=0.3 for hot-path. | cross_resolution_transport DEFAULT-ON (Plan 310 Phase 4, 2026-06-23): G1 mean cos 0.8944>=0.85, G2-A rank preservation mean cos 0.9300>=0.85 (Super-GOAT headline holds), G3 elbow k=8, G4 0 allocs. Implies funcattn as transitive default. | depth_invariance DEFAULT-ON (Plan 306 T7.4): G1/G2/G3 PASS, G4 re-spec to absolute-latency at HLA scale (all PASS), SIMD inner-loop landed. Zero runtime cost unless invoked. | salience_tri_gate DEFAULT-ON (Plan 303 Phase 5, 2026-06-23): 4/4 GOAT gates PASS — decide() 9.11ns <50ns target, decide_batch() 120.6M/s ≥50M target, G1 determinism + G2 ablation parity PASS. Zero runtime cost unless a caller invokes decide/decide_batch. | complexity_prior_sampler DEFAULT-ON (Plan 305 Phase 2, 2026-06-23): G2 majority-pass (RLE 92275× + Entropy 18455× stretch speedups on low-K optimum; L1 honest-negative on sparse byte encoding, documented domain mismatch) + G1 5/5 safety PASS. Zero runtime cost unless a caller invokes the sampler. | claim_rubric DEFAULT-ON (Plan 307 T3.3, 2026-06-23): meta-discipline validator, 17/17 Phase 2 round-trip + GOAT gate green. Zero runtime cost unless a probe/steering primitive explicitly invokes ClaimValidator::grade; promotion enforces the rubric at CI time per R287 §2.3.  # Production best perf + accuracy (Plan 051, bt_rank Plan 079, spectral_quant Plan 063, hybrid_oct_pq Plan 101 GOAT best MSE + 64x fewer FMAs vs OCT, elf_sde Plan 079, cna_steering Plan 087 GOAT, deep_manifold Plan 085 GOAT 6/6, federation Plan 085 GOAT 6/6, tes_loop Plan 086 GOAT 8/8, lattice_deduction Plan 088 GOAT 7/7, delta_routing Plan 097 GOAT 6/6, stability_metrics Plan 102 GOAT 13/13, mls_aggregate Plan 104 GOAT 6/6, gdn2_attention Plan 105 GOAT 14/14, dash_attn Plan 106 GOAT 9/9, dreamer Plan 107 GOAT 8/8, lt2_looped Plan 108 GOAT 8/8, dmax_spd Plan 109 GOAT 7/7, eqr_convergence Plan 119, subterranean Plan 110, sr2am_configurator Plan 112, data_gate Plan 111, plasma_path Plan 148 GOAT 5/5, parallel_probe Plan 133 26 unit tests, tf_loop Plan 136 GOAT 4/4, leo_all_goals Plan 155 SUPER GOAT, dual_leo Plan 155 SUPER GOAT, sigmoid_margin Plan 157 GOAT 7/7, moa_inference Plan 158 GOAT 3/3, sleep_consolidation Plan 154 GOAT 14/14, spectral_hierarchy Plan 156 GOAT, dual_gram_pca Plan 159 GOAT, roofline_cost Plan 159 GOAT, newton_schulz II Plan 152 GOAT 25/25, river_valley Plan 152 GOAT 25/25, peira_distill Plan 153 GOAT 7/7, kog_cpu_fusion Plan 160 GOAT 3/3 Gemma2 scale, thinking_cot Plan 194 GOAT 7/7 adaptive CoT, bandit_top_p Plan 181 dMoE adaptive top-p, trust_region_spec Plan 182 GOAT T1-T7, directional_credit Plan 184 GOAT 6/6, kv_share Plan 185 GOAT 7/7, nds_proxy Plan 186 GOAT 13/13, wealth_pruner Plan 187 GOAT, and_or_dtree Plan 190 GOAT, speculative_generator Plan 193 GOAT, chain_fold Plan 195 GOAT 16/16 validated by Plan 228, kvarn Plan 179 GOAT ALL PASS, partial_scoring Plan 191 GOAT 5/5, problem_mutator Plan 191 GOAT 2/2, idea_divergence Plan 191 GOAT 1/1, attn_match Plan 271 GOAT 9/9 (G1 β-recovery, G2 Cv reconstruction, G3 OMP residual, G4 HighestAttn coverage, G5 reconstruction quality, G6 router determinism, G7 no-alloc, G8 SIMD speedup))
