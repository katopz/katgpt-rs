manifold_pruner = ["katgpt-pruners/manifold_pruner", "katgpt-speculative/manifold_pruner"]  # ManifoldE point-to-manifold soft validity scoring (Research 207, Plan 234, GOAT G1 FAIL — demoted, keep opt-in). Plan 391: also forwards to katgpt-speculative so build_dd_tree_manifold + ManifoldValidWrapper (moved from root) compile.
sigmoid_graded_reject = ["katgpt-pruners/sigmoid_graded_reject"]  # Sigmoid-Graded Reject Confidence — tolerant soft-reject relax-and-retry caller (Plan 310 T1, Research 131 HarnessBridge Table 7). DEFAULT-ON (T4.1, 2026-06-26): T1 GOAT both halves PASS — T3.2 perf (default Δ 0.000ns, graded +3.734ns<5ns, batch 2647M/s, pipeline +0.241ns, G1 compat 0 mismatches, G5 deterministic) + T3.1 quality (tolerant FR 1.69%<strict 5.49% Δ -3.80pp, net reward +603.3 cost-weighted, precision ratio 0.9456, backward-compat, deterministic). Zero runtime cost unless a caller invokes soft_reject_with_relax; default reject_confidence() reproduces is_valid() bit-identically.
