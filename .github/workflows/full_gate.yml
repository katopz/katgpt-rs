# Full gate — the whole-surface compile + lint claim, run by CI rather than by habit.
#
# Before this workflow, nothing ran `--workspace --all-targets --all-features`.
# Every gate the repo documented was narrow on at least one of three
# independent axes (see scripts/full_gate.sh for the full account), so this
# surface was RED on `develop` from at least 2cb97410 until 3e58e821 — five
# broken targets — with every documented gate green the whole time.
# `scripts/full_gate.sh` is the assertion; this runs it strictly.
#
# ── Why macos-latest, and not the cheaper ubuntu-latest ──────────────────────
# This is the one platform choice that cannot be traded for cost. The device
# backends are gated `#[cfg(all(target_os = "macos", feature = "gpu_inference"))]`
# and their deps (metal, coreml-native, coreml-proto, prost) are optional
# entries under `[target.'cfg(target_os = "macos")'.dependencies]`. On Linux,
# `--all-features` switches the feature ON and still compiles the file to
# NOTHING, because the cfg is an `all(...)` over target_os AND feature.
# An ubuntu runner would therefore reproduce the exact vacuous green this gate
# exists to catch — it would have reported success on the E0425 pair in
# katgpt-backend/src/gpu.rs that motivated the gate. A cheap green here is
# worse than no gate.
#
# ── Why not on every push ────────────────────────────────────────────────────
# Measured: a cold `--all-targets --all-features` clippy run takes >13 min on a
# 16-core M3 Max. A GitHub macOS runner has far fewer cores, and macOS minutes
# bill at a multiple of Linux. Per-push is not worth it, and it is not what the
# gate is FOR: the failure mode it catches is slow rot (weeks red, unnoticed),
# not a per-commit regression. So it runs weekly, on demand, and whenever the
# gate's own definition changes — that last trigger matters, because a gate
# nobody validates after editing is a gate nobody is running.
#
# Promotion criterion, if per-push is ever wanted: land one green run with a
# warm cache and read its wall-clock off the summary first. Do not guess.
#
# MEASURED 2026-09-01, run 33531188553 — the first CI run of this gate that
# verified anything at all (.issues/705, closed + removed 2026-09-02; its
# narrative lives in git history):
#     2m17s wall-clock, 32 units compiled, 297 warning findings across 72
#     targets, 0 errors.
# Far cheaper than the >13 min the estimate above assumed, because `cargo clean
# -p` re-lints only the 32 workspace members while the dependency cache stays
# warm — the gate's actual subject is small.
#
# So per-push is now affordable on TIME. The open question is BILLING, not
# duration: macOS minutes bill at a multiple of Linux, so ~2m17s per push is
# roughly 23 Linux-equivalent minutes per push, and several agents push here
# daily. That is an owner's budget call, deliberately not taken here — the
# criterion asked for the number, and the number is above.
#
# Do NOT quote the 2m30s from runs 33523516143 / 33529923375. Those compiled
# zero units and measured nothing (.issues/705, closed + removed).
name: Full gate

on:
  workflow_dispatch:
  # SCHEDULE SUSPENDED (owner call 2026-09-09): the Actions spending limit is
  # hit, and scheduled workflows always evaluate against the DEFAULT branch
  # (`develop`), which the owner wants CI-silent. Re-add to re-enable:
  # schedule:
  #   - cron: '17 4 * * 1'
  push:
    # Main-only (owner call 2026-09-09) — same budget call as the schedule
    # suspension above; `develop` pushes no longer fire any katgpt-rs lane.
    branches: [main]
    # Only the gate's own definition. Broadening this to '**/*.rs' is the
    # per-push cost this file's preamble argues against.
    # NOTE: duplicated rather than shared via a YAML anchor — GitHub Actions
    # does not support anchors. Keep the two lists in sync.
    paths:
      - 'scripts/full_gate.sh'
      - '.github/workflows/full_gate.yml'
  pull_request:
    paths:
      - 'scripts/full_gate.sh'
      - '.github/workflows/full_gate.yml'
  workflow_dispatch:

# A queued rerun of a slow gate on the same ref is waste, but never cancel a
# scheduled run mid-flight in favour of a push — the schedule is the rot check.
concurrency:
  group: full-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-gate:
    runs-on: macos-latest
    # Generous: the local cold run exceeded 13 min on much better hardware, and
    # a cache miss here means a full cold build of every target at every feature.
    timeout-minutes: 180
    env:
      # This gate is the repo's ROT detector, so it runs at @stable — NOT at
      # the rust-toolchain.toml pin (issue 739). The pin makes local/consumer
      # builds deterministic; the rot property needs the opposite: clippy
      # gains deny-level lints between releases, and one of the five breaks
      # this gate first caught was exactly that (`approx_constant`,
      # deny-by-default). dtolnay/rust-toolchain does NOT export
      # RUSTUP_TOOLCHAIN, so without this override cargo inside the checkout
      # would resolve the pin file and the gate would silently freeze at the
      # pinned channel. A weekly red on a toolchain bump is the gate working,
      # not flaking — read the diagnostic before assuming the code changed.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v6

      # Same action + channel as `release-plz.yml`, the repo's only other Rust
      # workflow — one way to install a toolchain, not two. (release-plz and
      # the other test workflows have no RUSTUP_TOOLCHAIN override, so they
      # resolve rust-toolchain.toml and run at the pin — what consumers get.
      # This workflow is the deliberate stable-override exception; see env
      # above.)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # Layer 2b refuses a box without the wasm32 target rather than
          # report a partial pass — and its first CI run (34137014037,
          # 2026-09-07) did exactly that to this workflow, which never
          # installed it. The gate was right; the workflow was the missing
          # half. The wasm32 std lives in ~/.rustup, outside rust-cache's
          # scope, so this is a small per-run download — the price of the
          # lane actually compiling here instead of being skipped.
          targets: wasm32-unknown-unknown

      # Keyed on the lockfile; falls back to any prior cache for this OS so a
      # dep bump warms from the previous build instead of starting cold.
      - uses: Swatinem/rust-cache@v2
        with:
          key: full-gate
          # The gate compiles every target at every feature — a much larger
          # artifact set than a default build. Saving on failure too means a
          # timed-out cold run still leaves a warm cache for the next attempt,
          # which is how a 180-minute ceiling stays survivable.
          cache-on-failure: true

      # ── Why the workspace artifacts are thrown away, and the deps kept ──
      # The cache above made this gate VACUOUS. Measured on its first two CI
      # runs (33523516143 push, 33529923375 dispatch): "Restored from cache ...
      # full match: true", then cargo compiled ZERO units, replayed ZERO
      # diagnostics, and the gate printed
      #   ✓ full gate PASSED — 0 errors, 0 unbuildable targets (0 warning
      #     finding(s) across 0 target(s))
      # while the same command on the workstation reported 119 findings across
      # 20 targets the same day. A green built from nothing — the exact failure
      # this gate exists to catch, committed by the gate.
      #
      # `cargo clean -p` on each workspace member only. That is the honest split
      # of the cache: DEPENDENCIES are the expensive part and the gate makes no
      # claim about them, while the WORKSPACE MEMBERS are the entire subject of
      # the assertion and must be re-linted every run. Deleting the whole cache
      # instead would be correct but pays a full cold dep build every week for
      # no added coverage.
      #
      # Members are enumerated from `cargo metadata`, never typed — a hand-typed
      # list silently stops covering a new crate, which is this repo's most
      # frequently rediscovered defect (Issue 703).
      #
      # scripts/full_gate.sh Layer 3b now FAILS a run that compiled nothing and
      # replayed nothing, so if this step ever stops working the gate says so
      # instead of printing another zero-built green.
      - name: Drop workspace artifacts so the gate actually re-lints them
        run: |
          set -euo pipefail
          members=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(" ".join(p["name"] for p in json.load(sys.stdin)["packages"]))')
          echo "▸ re-linting $(printf '%s\n' $members | wc -l | tr -d ' ') workspace member(s)"
          for m in $members; do cargo clean -p "$m" 2>/dev/null || true; done

      # ── Issue 735 T3: does THIS runner launder an aborting gate? ────────
      #
      # `scripts/full_gate.sh` carries a completion sentinel because a bash
      # that aborts on an unbound expansion enters the EXIT trap with `$?`
      # already 0 and the abort exits 0. That was measured on macOS
      # /bin/bash 3.2.57 and REFUTED on bash 4.4 through 5.3 — so whether the
      # sentinel is load-bearing HERE depends on what `#!/usr/bin/env bash`
      # resolves to on GitHub's macOS image, and no workstation can answer
      # that. This is the only macOS runner in this repo that runs a
      # sentinelled script, so the measurement belongs here.
      #
      # MEASURED 2026-09-07, run 34137014037 (macos-26-arm64): PATH bash =
      # /bin/bash = env bash = 3.2.57(1) — the image ships NO Homebrew bash
      # in PATH — and the premise matrix re-measured on the runner reproduces
      # all five errexit LAUNDERS cells. The macOS CI lane launders exactly
      # like the workstation: the sentinel is load-bearing here, not just
      # locally. The step stays because the answer is per-image and this
      # re-measures it every run.
      #
      # A step, not a run of its own: the audit re-measures the premise matrix
      # on the box every time it starts and costs ~1s. `|| true` because this
      # is EVIDENCE, not a verdict — the gate below owns the verdict, and a
      # probe that can red a 180-minute gate would get deleted.
      - name: Which bash is this, and does it launder an abort? (Issue 735 T3)
        run: |
          set -uo pipefail
          echo "PATH bash : $(command -v bash) — $(bash --version | head -1)"
          echo "/bin/bash : $(/bin/bash --version | head -1)"
          echo "env bash  : $(/usr/bin/env bash --version | head -1)"
          python3 scripts/trap_exit_launder_audit.py 2>&1 | sed -n '1,30p' || true

      # Strict: no --allow-partial-platform. On a non-macOS runner the script
      # refuses to report a pass, so this step cannot silently degrade into the
      # partial gate the preamble warns about.
      - name: Full gate (workspace, all targets, all features, keep-going)
        env:
          # Put the clippy log where the next step can upload it. The script
          # retains it only on failure and removes it on a pass, so the upload
          # below is correctly conditioned on failure().
          FULL_GATE_LOG: ${{ runner.temp }}/full_gate.log
        run: ./scripts/full_gate.sh

      # The script's failure summary prints error CLASSES and the first
      # diagnostic — enough to triage, not enough to fix. The rest exists only
      # in the log, and a GitHub runner is destroyed when the job ends, so
      # without this step the only way to see the remaining sites is to
      # re-run the whole >13 min gate locally.
      # `always()`, not `failure()`. A green's evidence used to be destroyed with
      # the runner, which is why two vacuous passes went unexamined: the summary
      # said PASSED and the log that would have shown "0 units compiled" was
      # unreachable. A pass whose working is unavailable is a claim, not a
      # result — and this gate's whole subject is the difference.
      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-gate-log
          path: ${{ runner.temp }}/full_gate.log
          # A cold run's log is large and its value decays fast; the commit
          # that broke the gate is what matters, and that is in git.
          retention-days: 14
          # `warn`, not `error`: the script removes the log on a pass when
          # FULL_GATE_LOG is unset. It is set above, so a missing file here is
          # itself worth seeing — but it must not fail an otherwise-green gate.
          if-no-files-found: warn
